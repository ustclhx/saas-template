<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>通用分享页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.btn:hover{text-decoration:none}
.btn-lg{height:40px;padding:0 20px}
</style>
</helmet>
<div style="{{t.root}}">
  <header style="{{t.header}}">
    <div style="width: 100%; max-width: 72rem; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; font-size: 16px; line-height: 22px; font-weight: 600">
        <span style="{{t.mark}}">A</span>
        <span>Acme</span>
      </a>
      <nav aria-label="站点" style="display: flex; align-items: center; gap: 20px; font-size: 14px; line-height: 20px">
        <a href="#" style="{{t.muted}}">定价</a>
        <a href="#" style="{{t.muted}}">登录</a>
        <a href="#" class="btn" style="{{t.primaryBtn}}">免费开始</a>
      </nav>
    </div>
  </header>

  <main style="flex-grow: 1; width: 100%; max-width: 48rem; margin: 0 auto; padding: 48px 32px 64px; display: flex; flex-direction: column; gap: 24px">
    <sc-if value="{{s.ok}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="{{t.metaRow}}">
          <span style="{{t.badge}}">报告摘要</span>
          <span>由 Acme 用户分享 · 2026-11-13</span>
        </div>
        <div style="{{t.cardFrame}}">
          <div style="width: 1200px; height: 630px; transform: scale(0.5867); transform-origin: 0 0">
            <dc-import name="Card" dark="{{dark}}" variant="zh" hint-size="1200px,630px"></dc-import>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em">2026 年第三季度用户调研要点</h1>
          <p style="{{t.desc}}">新用户留存提升 12%，主要来自引导流程简化；移动端满意度仍低于桌面端。完整报告包含 5 条结论与 3 个风险。</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a href="#" class="btn btn-lg" style="{{t.primaryBtn}}">用 Acme 生成你的报告</a>
          <a href="#" class="btn btn-lg" style="{{t.outlineBtn}}">了解 Acme</a>
        </div>
        <div style="{{t.note}}">这是 Acme 用户公开分享的结果，分享者可以随时撤销。链接有效期至 2027-02-11。</div>
      </div>
    </sc-if>

    <sc-if value="{{s.gone}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 96px 0 64px">
        <div style="{{t.iconWrap}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7"></path><path d="M15 7h2a5 5 0 0 1 4 8"></path><path d="M8 12h4"></path><path d="m2 2 20 20"></path></svg>
        </div>
        <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">{{s.goneTitle}}</h1>
        <p style="{{t.descCenter}}">{{s.goneText}}</p>
        <a href="#" class="btn" style="{{t.primaryBtn}}">返回首页</a>
      </div>
    </sc-if>
  </main>

  <footer style="{{t.footer}}">
    <div style="width: 100%; max-width: 72rem; margin: 0 auto; padding: 20px 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px">
      <span>© 2026 Acme</span>
      <span style="display: flex; gap: 16px"><a href="#">隐私政策</a><a href="#">服务条款</a></span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["normal","notFound","expired"],"default":"normal"},"$preview":{"width":1440,"height":1100}}'>
function uiTokens(dark) {
  return dark ? {
    bg: '#171717', card: '#252525', fg: '#f5f5f5', muted: '#252525', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    border: 'rgba(245,245,245,0.12)', input: '#404040'
  } : {
    bg: '#fafafa', card: '#ffffff', fg: '#171717', muted: '#f4f4f5', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    border: 'rgba(23,23,23,0.12)', input: '#e5e5e5'
  };
}
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var st = this.props.state || 'normal';
    var t = uiTokens(dark);
    return {
      dark: dark,
      s: {
        ok: st === 'normal', gone: st !== 'normal',
        goneTitle: st === 'expired' ? '这个分享已过期' : '分享不存在或已被撤销',
        goneText: st === 'expired' ? '分享链接已超过有效期。如需查看，请联系分享者重新分享。' : '链接可能有误，或分享者已撤销分享。'
      },
      t: {
        root: 'min-height: 1100px; display: flex; flex-direction: column; background: ' + t.bg + '; color: ' + t.fg + '; font-family: Inter, ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif; font-size: 14px; line-height: 20px;',
        header: 'border-bottom: 1px solid ' + t.border + ';',
        footer: 'border-top: 1px solid ' + t.border + '; font-size: 12px; line-height: 16px; color: ' + t.mfg + ';',
        mark: 'width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; background: ' + t.primary + '; color: ' + t.pfg + ';',
        muted: 'color: ' + t.mfg + ';',
        primaryBtn: 'background: ' + t.primary + '; color: ' + t.pfg + ';',
        outlineBtn: 'background: ' + t.card + '; color: ' + t.fg + '; box-shadow: inset 0 0 0 1px ' + t.input + ';',
        metaRow: 'display: flex; align-items: center; gap: 12px; font-size: 12px; line-height: 16px; color: ' + t.mfg + ';',
        badge: 'display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 9999px; font-weight: 500; background: ' + t.muted + '; color: ' + t.fg + ';',
        cardFrame: 'width: 704px; height: 370px; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px ' + t.border + ', 0 1px 3px 0 rgba(0,0,0,0.1);',
        desc: 'margin: 0; font-size: 16px; line-height: 24px; color: ' + t.mfg + ';',
        descCenter: 'margin: 0; max-width: 28rem; font-size: 14px; line-height: 20px; color: ' + t.mfg + ';',
        note: 'padding-top: 16px; border-top: 1px solid ' + t.border + '; font-size: 12px; line-height: 16px; color: ' + t.mfg + ';',
        iconWrap: 'width: 48px; height: 48px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; background: ' + t.muted + '; color: ' + t.mfg + ';'
      }
    };
  }
}
</script>
</body>
</html>
