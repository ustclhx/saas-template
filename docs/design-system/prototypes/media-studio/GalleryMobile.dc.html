<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>公开画廊（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;margin:0;cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:8px;font-weight:500;white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px}
.seg{display:flex;padding:3px;border-radius:9px;gap:2px}
.segb{height:36px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:500}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border-radius:10px;position:relative}
.masonry{column-count:2;column-gap:10px}
.card{break-inside:avoid;margin-bottom:10px;display:block}
svg{flex-shrink:0}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.bg}};color:{{t.fg}}">
  <header class="row" style="height:56px;padding:0 6px 0 16px;gap:8px;border-bottom:1px solid {{t.border}};background:{{t.panel}}">
    <a href="#" class="sub" style="flex:1">SaaS 模板</a>
    <a href="#" class="btn" style="height:36px;padding:0 12px;background:{{t.primary}};color:{{t.pfg}}">开始创作</a>
    <button type="button" class="ib" aria-label="打开菜单"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header>
  <main class="col" style="flex:1;overflow:hidden;padding:20px 16px 0;gap:14px">
    <div class="col" style="gap:4px">
      <h1 style="margin:0;font-size:24px;line-height:32px;font-weight:600">作品画廊</h1>
      <p class="cap" style="margin:0;color:{{t.mfg}}">用户用 AI 生成并公开分享的图片和视频。</p>
    </div>
    <div class="row" style="gap:8px">
      <nav class="seg" aria-label="类型" style="background:{{t.secondary}}">
        <a href="#" class="segb" aria-current="page" style="background:{{t.card}};box-shadow:{{t.sh2}}">全部</a>
        <a href="#" class="segb" style="color:{{t.mfg}}">图片</a>
        <a href="#" class="segb" style="color:{{t.mfg}}">视频</a>
      </nav>
      <a href="#" class="segb" style="margin-left:auto;color:{{t.mfg}};box-shadow:inset 0 0 0 1px {{t.border}}">精选</a>
    </div>
    <sc-if value="{{normal}}" hint-placeholder-val="{{true}}">
      <div class="masonry" style="flex:1;overflow:hidden">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
          <a href="WorkMobile.dc.html" class="card" aria-label="{{c.title}}">
            <div class="ph" style="height:{{c.h}}px;background:{{c.tint}};color:{{t.mfg}}">
              <span class="cap">{{c.kindLabel}}</span>
              <sc-if value="{{c.dur}}" hint-placeholder-val="{{false}}"><span class="badge" style="position:absolute;right:6px;bottom:6px;background:{{t.overlay}};color:#ffffff">{{c.dur}}</span></sc-if>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div class="col" style="align-items:center;text-align:center;gap:8px;padding:64px 16px;border-radius:12px;box-shadow:inset 0 0 0 1px {{t.border}}">
        <span class="sub">画廊里还没有作品</span>
        <span class="cap" style="color:{{t.mfg}}">生成后在「我的作品」里点发布，就会出现在这里。</span>
        <a href="#" class="btn" style="margin-top:8px;background:{{t.primary}};color:{{t.pfg}}">开始创作</a>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["normal","empty"],"default":"normal"},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    border: 'rgba(245,245,245,0.12)', overlay: 'rgba(0,0,0,0.6)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    border: 'rgba(23,23,23,0.12)', overlay: 'rgba(0,0,0,0.6)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#252525' : '#f4f4f5';
  t.sh2 = dark ? 'inset 0 0 0 1px rgba(255,255,255,0.02), 0 1px 1px -0.5px rgba(0,0,0,0.18)' : '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06)';
  t.tints = dark ? ['#2a2a2a', '#303030', '#262626', '#2d2d2d'] : ['#ececee', '#e4e4e7', '#f0f0f1', '#e8e8ea'];
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var t = uiTokens(!!this.props.dark);
    var s = this.props.state || 'normal';
    var hs = [200, 150, 240, 170, 210, 160, 230, 180];
    var titles = ['清晨的山间木屋', '雾中的湖面', '城市夜景水彩', '海边的灯塔', '樱花小路', '极光下的帐篷', '雨后的街角', '复古列车'];
    return {
      t: t,
      normal: s === 'normal', empty: s === 'empty',
      cards: titles.map(function (n, i) { var v = i === 1 || i === 4; return { title: n, h: hs[i], tint: t.tints[i % 4], kindLabel: v ? '示例视频' : '示例图', dur: v ? '0:05' : '' }; })
    };
  }
}
</script>
</body>
</html>
