<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>我的作品（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;position:relative}
button,input{font:inherit;color:inherit;margin:0}
button{cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:8px;font-weight:500;white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px}
.seg{display:flex;padding:3px;border-radius:9px;gap:2px}
.segb{height:32px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:500;white-space:nowrap}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.lbl{font-size:12px;line-height:16px;font-weight:500}
svg{flex-shrink:0}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.panel}};color:{{t.fg}}">
  <header class="row" style="height:56px;padding:0 6px;gap:4px;border-bottom:1px solid {{t.border}}">
    <button type="button" class="ib" aria-label="打开菜单"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <h1 class="sub" style="margin:0;flex:1">我的作品</h1>
  </header>
  <div class="col" style="padding:12px 16px;gap:10px">
    <div class="row" style="gap:8px">
      <div class="seg" role="group" aria-label="类型" style="background:{{t.secondary}}">
        <button type="button" class="segb" aria-pressed="true" style="background:{{t.card}};box-shadow:{{t.sh2}}">全部</button>
        <button type="button" class="segb" aria-pressed="false" style="color:{{t.mfg}}">图片</button>
        <button type="button" class="segb" aria-pressed="false" style="color:{{t.mfg}}">视频</button>
      </div>
      <button type="button" class="btn" aria-haspopup="listbox" style="height:38px;padding:0 12px;margin-left:auto;box-shadow:inset 0 0 0 1px {{t.border}}">状态：全部</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px 16px;overflow:hidden">
    <sc-for list="{{works}}" as="w" hint-placeholder-count="6">
      <article class="col" style="border-radius:12px;overflow:hidden;background:{{t.card}};box-shadow:inset 0 0 0 1px {{t.border}}">
        <div class="ph" style="height:150px;background:{{w.tint}};color:{{t.mfg}};position:relative">
          <span class="cap">{{w.kindLabel}}</span>
          <span class="badge" style="position:absolute;left:6px;top:6px;background:{{w.bBg}};color:{{w.bFg}}">{{w.badge}}</span>
        </div>
        <div class="row" style="padding:4px 4px 4px 10px;gap:4px">
          <span class="cap" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{w.title}}</span>
          <button type="button" class="ib" aria-label="作品操作：{{w.title}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></button>
        </div>
      </article>
    </sc-for>
  </div>

  <sc-if value="{{publish}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;background:{{t.overlay}}"></div>
    <div class="col" role="dialog" aria-modal="true" aria-labelledby="mpT" style="position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;background:{{t.card}};box-shadow:{{t.sh5}};padding:12px 16px 24px;gap:14px">
      <span style="align-self:center;width:36px;height:4px;border-radius:9999px;background:{{t.active}}"></span>
      <div class="col" style="gap:4px"><h2 id="mpT" class="sub" style="margin:0;font-size:16px">发布到画廊</h2><p class="cap" style="margin:0;color:{{t.mfg}}">发布后立即出现在画廊，审核通过后才会被搜索引擎收录。</p></div>
      <div class="col" style="gap:6px">
        <label class="lbl" for="mpt">标题</label>
        <input id="mpt" value="清晨的山间木屋" style="height:44px;padding:0 12px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px {{t.border}};background:{{t.card}};outline:none">
      </div>
      <div class="row" style="gap:12px;padding:12px;border-radius:10px;background:{{t.secondary}}">
        <div class="col" style="flex:1"><span style="font-weight:500">公开提示词</span><span class="cap" style="color:{{t.mfg}}">访客可以用它「做同款」。</span></div>
        <button type="button" role="switch" aria-checked="true" aria-label="公开提示词" style="width:36px;height:20px;border-radius:9999px;background:{{t.primary}};position:relative"><span style="position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:9999px;background:{{t.pfg}}"></span></button>
      </div>
      <span class="cap" style="color:{{t.mfg}}">今日还可发布 17 / 20 次</span>
      <div class="row" style="gap:8px"><button type="button" class="btn" style="flex:1;box-shadow:inset 0 0 0 1px {{t.border}}">取消</button><button type="button" class="btn" style="flex:1;background:{{t.primary}};color:{{t.pfg}}">发布</button></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["normal","publishDialog"],"default":"normal"},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    destructive: '#fca5a5', dangerBg: 'rgba(252,165,165,0.12)', ok: '#86efac', okBg: 'rgba(134,239,172,0.12)', warn: '#fcd34d', warnBg: 'rgba(252,211,77,0.12)',
    border: 'rgba(245,245,245,0.12)', active: 'rgba(255,255,255,0.1)', overlay: 'rgba(0,0,0,0.6)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    destructive: '#b91c1c', dangerBg: 'rgba(185,28,28,0.08)', ok: '#15803d', okBg: 'rgba(21,128,61,0.1)', warn: '#a16207', warnBg: 'rgba(234,179,8,0.12)',
    border: 'rgba(23,23,23,0.12)', active: 'rgba(0,0,0,0.07)', overlay: 'rgba(0,0,0,0.4)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#252525' : '#f4f4f5';
  t.sh2 = dark ? 'inset 0 0 0 1px rgba(255,255,255,0.02), 0 1px 1px -0.5px rgba(0,0,0,0.18)' : '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06)';
  t.sh5 = dark ? '0 0 0 1px rgba(255,255,255,0.08), 0 6px 12px -4px rgba(0,0,0,0.4)' : '0 0 0 1px rgba(0,0,0,0.06), 0 6px 12px -4px rgba(0,0,0,0.12)';
  t.tints = dark ? ['#2a2a2a', '#303030', '#262626', '#2d2d2d'] : ['#ececee', '#e4e4e7', '#f0f0f1', '#e8e8ea'];
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var t = uiTokens(!!this.props.dark);
    var st = { priv: ['未公开', t.secondary, t.mfg], pend: ['待审核', t.warnBg, t.warn], pub: ['已公开', t.okBg, t.ok], rem: ['已下架：侵权', t.dangerBg, t.destructive] };
    var rows = [['清晨的山间木屋', 'pub', 0], ['雾中的湖面', 'pend', 1], ['城市夜景水彩', 'priv', 0], ['海边的灯塔', 'priv', 0], ['樱花小路', 'pub', 1], ['复古海报风格咖啡馆', 'rem', 0]];
    return {
      t: t,
      publish: this.props.state === 'publishDialog',
      works: rows.map(function (r, i) { var m = st[r[1]]; return { title: r[0], badge: m[0], bBg: m[1], bFg: m[2], tint: t.tints[i % 4], kindLabel: r[2] ? '示例视频' : '示例图' }; })
    };
  }
}
</script>
</body>
</html>
