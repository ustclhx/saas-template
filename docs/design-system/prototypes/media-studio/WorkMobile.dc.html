<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>作品页（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;position:relative}
button,textarea,input{font:inherit;color:inherit;margin:0}
button{cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:8px;font-weight:500;white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border-radius:12px}
.lbl{font-size:12px;line-height:16px;font-weight:500}
.rad{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:8px}
svg{flex-shrink:0}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.bg}};color:{{t.fg}}">
  <header class="row" style="height:56px;padding:0 6px 0 4px;gap:4px;border-bottom:1px solid {{t.border}};background:{{t.panel}}">
    <a href="GalleryMobile.dc.html" class="ib" aria-label="返回画廊"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span class="sub" style="flex:1">画廊</span>
    <a href="#" class="btn" style="height:36px;padding:0 12px;box-shadow:inset 0 0 0 1px {{t.border}}">登录</a>
  </header>
  <main class="col" style="flex:1;overflow:hidden;padding:16px;gap:14px">
    <sc-if value="{{isImage}}" hint-placeholder-val="{{true}}">
      <div class="ph" role="img" aria-label="{{title}}" style="height:358px;background:{{tint}};color:{{t.mfg}}"><span class="cap">示例图 · 1024 × 1024</span></div>
    </sc-if>
    <sc-if value="{{isVideo}}" hint-placeholder-val="{{false}}">
      <div class="col" style="height:240px;border-radius:12px;overflow:hidden;background:{{tint}}">
        <div class="ph" style="flex:1;border-radius:0;color:{{t.mfg}}"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m10 8 6 4-6 4z"></path></svg><span class="cap">示例视频 · 0:05</span></div>
      </div>
    </sc-if>
    <h1 style="margin:0;font-size:20px;line-height:28px;font-weight:600">{{title}}</h1>
    <span class="cap" style="color:{{t.mfg}}">{{meta}}</span>
    <div class="col" style="gap:6px;padding:12px;border-radius:12px;background:{{t.secondary}}">
      <div class="row"><span class="lbl" style="flex:1">提示词</span><button type="button" class="btn" style="height:32px;padding:0 8px;font-size:12px;color:{{t.mfg}}">复制</button></div>
      <p style="margin:0">{{prompt}}</p>
    </div>
    <div class="row" style="gap:8px;margin-top:auto">
      <button type="button" class="ib" aria-label="复制链接" style="box-shadow:inset 0 0 0 1px {{t.border}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg></button>
      <button type="button" class="btn" style="color:{{t.mfg}}">举报</button>
      <a href="#" class="btn" style="flex:1;background:{{t.primary}};color:{{t.pfg}}">做同款</a>
    </div>
  </main>

  <sc-if value="{{report}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;background:{{t.overlay}}"></div>
    <div class="col" role="dialog" aria-modal="true" aria-labelledby="mrT" style="position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;background:{{t.card}};box-shadow:{{t.sh5}};padding:12px 16px 24px;gap:12px">
      <span style="align-self:center;width:36px;height:4px;border-radius:9999px;background:{{t.active}}"></span>
      <h2 id="mrT" class="sub" style="margin:0;font-size:16px">举报作品</h2>
      <fieldset class="col" style="border:0;padding:0;margin:0;gap:0">
        <legend class="lbl" style="padding:0;margin-bottom:4px">原因</legend>
        <sc-for list="{{reasons}}" as="rs" hint-placeholder-count="6">
          <label class="rad" style="background:{{rs.bg}}"><input type="radio" name="mreason" checked="{{rs.on}}" style="width:18px;height:18px;accent-color:{{t.primary}}">{{rs.label}}</label>
        </sc-for>
      </fieldset>
      <div class="row" style="gap:10px;height:56px;padding:0 12px;border-radius:8px;box-shadow:inset 0 0 0 1px {{t.border}};color:{{t.mfg}}"><span class="cap">人机验证（Turnstile，未登录时显示）</span></div>
      <div class="row" style="gap:8px"><button type="button" class="btn" style="flex:1;box-shadow:inset 0 0 0 1px {{t.border}}">取消</button><button type="button" class="btn" style="flex:1;background:{{t.primary}};color:{{t.pfg}}">提交举报</button></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["image","video","reportDialog"],"default":"image"},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    border: 'rgba(245,245,245,0.12)', active: 'rgba(255,255,255,0.1)', overlay: 'rgba(0,0,0,0.6)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    border: 'rgba(23,23,23,0.12)', active: 'rgba(0,0,0,0.07)', overlay: 'rgba(0,0,0,0.4)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#252525' : '#f4f4f5';
  t.sh5 = dark ? '0 0 0 1px rgba(255,255,255,0.08), 0 6px 12px -4px rgba(0,0,0,0.4)' : '0 0 0 1px rgba(0,0,0,0.06), 0 6px 12px -4px rgba(0,0,0,0.12)';
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var t = uiTokens(!!this.props.dark);
    var s = this.props.state || 'image';
    var video = s === 'video';
    return {
      t: t,
      isImage: !video, isVideo: video,
      tint: this.props.dark ? '#303030' : '#e4e4e7',
      title: video ? '雾中的湖面' : '清晨的山间木屋',
      meta: video ? 'Wan 2.2 图生视频 · 5 秒 · 2026-11-26' : 'FLUX 快速 · 1024 × 1024 · 2026-11-26',
      prompt: video ? '湖面上的薄雾慢慢散开，镜头缓缓推进' : '清晨的山间木屋，薄雾，柔和的光线，水彩风格',
      report: s === 'reportDialog',
      reasons: ['色情低俗', '暴力血腥', '仇恨或歧视', '侵犯版权', '垃圾信息', '其他'].map(function (n, i) { return { label: n, on: i === 3, bg: i === 3 ? t.secondary : 'transparent' }; })
    };
  }
}
</script>
</body>
</html>
