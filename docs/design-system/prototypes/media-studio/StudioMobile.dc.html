<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>创作页（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;position:relative}
button,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:8px;font-weight:500;white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px}
.lbl{font-size:12px;line-height:16px;font-weight:500}
.fld{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:8px;justify-content:space-between}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:9999px;font-size:12px;font-weight:500}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border-radius:10px}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:500}
.sk{border-radius:10px;animation:sk 1.6s ease-in-out infinite}
@keyframes sk{0%,100%{opacity:1}50%{opacity:0.5}}
svg{flex-shrink:0}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.panel}};color:{{t.fg}}">
  <header class="row" style="height:56px;padding:0 6px;gap:4px;border-bottom:1px solid {{t.border}}">
    <button type="button" class="ib" aria-label="打开菜单"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <h1 class="sub" style="margin:0;flex:1">创作</h1>
    <span class="cap" style="color:{{t.mfg}};padding-right:12px">余额 1,240</span>
  </header>
  <div class="col" style="flex:1;overflow:hidden;padding:16px;gap:14px">
    <div class="row" role="tablist" aria-label="创作模式" style="padding:3px;border-radius:9px;background:{{t.secondary}};gap:2px">
      <button type="button" role="tab" aria-selected="true" class="btn" style="flex:1;height:38px;background:{{t.card}};box-shadow:{{t.sh2}}">图片</button>
      <button type="button" role="tab" aria-selected="false" class="btn" style="flex:1;height:38px;color:{{t.mfg}}">视频</button>
    </div>
    <div class="col" style="gap:6px">
      <label class="lbl" for="mp">提示词</label>
      <textarea id="mp" rows="3" style="resize:none;padding:10px 12px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px {{t.border}};background:{{t.card}};outline:none">{{prompt}}</textarea>
    </div>
    <div class="row" style="gap:8px">
      <button type="button" class="fld" aria-haspopup="listbox" style="flex:1;background:{{t.card}};box-shadow:inset 0 0 0 1px {{t.border}}"><span>FLUX 快速</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:{{t.mfg}}"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button type="button" class="btn" aria-expanded="false" style="box-shadow:inset 0 0 0 1px {{t.border}}">更多设置</button>
    </div>
    <div class="row" style="gap:6px;overflow:hidden">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
        <button type="button" class="chip" aria-pressed="{{p.on}}" style="background:{{p.bg}};color:{{p.fg}};box-shadow:inset 0 0 0 1px {{t.border}}">{{p.label}}</button>
      </sc-for>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{true}}">
      <div class="col" style="flex:1;align-items:center;justify-content:center;text-align:center;gap:8px;border-radius:12px;box-shadow:inset 0 0 0 1px {{t.border}};padding:16px">
        <span class="sub">还没有生成内容</span>
        <span class="cap" style="color:{{t.mfg}}">写下想要的画面，点「生成」。结果会保存到我的作品。</span>
      </div>
    </sc-if>
    <sc-if value="{{running}}" hint-placeholder-val="{{false}}">
      <div class="col" style="flex:1;gap:10px">
        <div class="sk" style="flex:1;background:{{t.active}}"></div>
        <span class="cap" role="status" style="color:{{t.mfg}}">正在生成，通常需要 10–30 秒，可以离开页面。</span>
      </div>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <div class="col" style="flex:1;gap:10px;min-height:0">
        <div class="ph" style="flex:1;background:{{t.tint}};color:{{t.mfg}}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg><span class="cap">示例图 · 1 / 2</span></div>
        <div class="row" style="gap:8px"><button type="button" class="btn" style="flex:1;box-shadow:inset 0 0 0 1px {{t.border}}">下载</button><button type="button" class="btn" style="flex:1;box-shadow:inset 0 0 0 1px {{t.border}}">发布到画廊</button></div>
      </div>
    </sc-if>
  </div>
  <footer class="row" style="gap:12px;padding:12px 16px;border-top:1px solid {{t.border}};background:{{t.card}}">
    <span class="cap" style="flex:1;color:{{t.mfg}}">预计 <strong style="color:{{t.fg}}">8</strong> 积分，失败不扣</span>
    <button type="button" class="btn" disabled="{{busy}}" style="background:{{t.primary}};color:{{t.pfg}};opacity:{{busyOpacity}};min-width:120px">{{genLabel}}</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["empty","running","done"],"default":"done"},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    border: 'rgba(245,245,245,0.12)', active: 'rgba(255,255,255,0.1)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    border: 'rgba(23,23,23,0.12)', active: 'rgba(0,0,0,0.07)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#252525' : '#f4f4f5';
  t.sh2 = dark ? 'inset 0 0 0 1px rgba(255,255,255,0.02), 0 1px 1px -0.5px rgba(0,0,0,0.18)' : '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06)';
  t.tint = dark ? '#2a2a2a' : '#ececee';
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var t = uiTokens(!!this.props.dark);
    var s = this.props.state || 'done';
    return {
      t: t,
      prompt: s === 'empty' ? '' : '清晨的山间木屋，薄雾，柔和的光线',
      presets: ['水彩', '胶片', '插画', '3D 渲染'].map(function (n, i) { var on = i === 0 && s !== 'empty'; return { label: n, on: on ? 'true' : 'false', bg: on ? t.primary : t.card, fg: on ? t.pfg : t.fg }; }),
      empty: s === 'empty', running: s === 'running', done: s === 'done',
      busy: s !== 'done', busyOpacity: s === 'done' ? 1 : 0.5,
      genLabel: s === 'running' ? '生成中…' : '生成'
    };
  }
}
</script>
</body>
</html>
