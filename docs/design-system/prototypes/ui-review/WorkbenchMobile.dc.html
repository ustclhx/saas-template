<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>工作台·手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;font-optical-sizing:auto;width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.ttl{font-size:16px;line-height:22px;font-weight:600}
.dspc{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-0.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.btn-sm{height:32px;padding:0 12px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;position:relative;flex-shrink:0}
.hv:hover{background:rgba(128,128,128,0.1)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:9999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.grp{font-size:12px;line-height:16px;font-weight:500;padding:0 8px;margin-bottom:4px}
.ni{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px}
.sk{border-radius:6px;animation:sk 1.6s ease-in-out infinite}
@keyframes sk{0%,100%{opacity:1}50%{opacity:0.5}}
svg{flex-shrink:0}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.panel}};color:{{t.fg}}">

  <header class="row" style="height:56px;gap:4px;padding:0 8px;flex-shrink:0;border-bottom:1px solid {{t.border}};background:{{t.panel}}">
    <button type="button" class="ib hv" aria-label="打开导航" aria-expanded="{{drawerStr}}" aria-controls="drawer" onClick="{{openDrawer}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <h1 class="ttl" style="margin:0;flex:1">工作台</h1>
    <button type="button" class="ib hv" aria-label="通知，2 条未读" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:9999px;background:{{t.destructive}}"></span></button>
  </header>

  <main class="col" style="flex:1;min-height:0;overflow:hidden;padding:16px;gap:16px">
    <sc-if value="{{claimVisible}}" hint-placeholder-val="{{true}}">
      <div role="status" class="row" style="gap:10px;padding:10px 10px 10px 12px;border-radius:12px;background:{{t.card}};border:1px solid {{t.border}}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"></path></svg>
        <span class="col" style="flex:1;min-width:0"><span style="font-weight:500">今日奖励可领取</span><span class="cap" style="color:{{t.mfg}}">每天 10 积分（示例）</span></span>
        <button type="button" class="btn btn-sm" style="background:{{t.primary}};color:{{t.pfg}}">领取</button>
      </div>
    </sc-if>

    <sc-if value="{{s.loading}}" hint-placeholder-val="{{false}}">
      <div class="col" style="gap:8px"><span class="sk" style="width:200px;height:24px;background:{{t.active}}"></span><span class="sk" style="width:260px;height:12px;background:{{t.active}}"></span></div>
    </sc-if>
    <sc-if value="{{s.ready}}" hint-placeholder-val="{{true}}">
      <div class="col" style="gap:2px">
        <h2 class="dspc" style="margin:0">下午好，示例用户</h2>
        <p style="margin:0;color:{{t.mfg}}">继续上次的工作，或从一个新问题开始。</p>
      </div>
    </sc-if>

    <section aria-label="积分余额" class="col" style="gap:12px;padding:14px 16px;border-radius:12px;background:{{t.card}};border:1px solid {{t.border}}">
      <sc-if value="{{s.loading}}" hint-placeholder-val="{{false}}">
        <div class="col" style="gap:10px"><span class="sk" style="width:96px;height:28px;background:{{t.active}}"></span><span class="sk" style="height:12px;background:{{t.active}}"></span></div>
      </sc-if>
      <sc-if value="{{s.error}}" hint-placeholder-val="{{false}}">
        <div class="row" style="justify-content:space-between"><span style="color:{{t.mfg}}">暂时无法获取余额</span><button type="button" class="btn btn-sm" style="box-shadow:inset 0 0 0 1px {{t.border}}">重试</button></div>
      </sc-if>
      <sc-if value="{{s.balReady}}" hint-placeholder-val="{{true}}">
        <div class="col" style="gap:12px">
          <div class="row" style="justify-content:space-between;align-items:flex-end">
            <span class="col"><span class="cap" style="color:{{t.mfg}}">可用积分 · 示例</span><span class="dspc" style="font-variant-numeric:tabular-nums">{{bal.total}}</span></span>
            <a href="#" class="btn btn-sm" style="box-shadow:inset 0 0 0 1px {{t.border}}">购买积分包</a>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
            <sc-for list="{{bal.parts}}" as="b" hint-placeholder-count="3">
              <span class="col" style="gap:2px;padding:8px;border-radius:8px;background:{{t.hover}}"><span class="cap" style="color:{{t.mfg}}">{{b.label}}</span><span style="font-weight:500;font-variant-numeric:tabular-nums">{{b.value}}</span></span>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </section>

    <section aria-labelledby="m-recent" class="col" style="gap:4px">
      <div class="row" style="justify-content:space-between"><h3 id="m-recent" class="ttl" style="margin:0">最近对话</h3><a href="#" class="cap" style="color:{{t.mfg}}">全部</a></div>
      <sc-if value="{{s.normal}}" hint-placeholder-val="{{true}}">
        <div class="col">
          <sc-for list="{{recent}}" as="c" hint-placeholder-count="4">
            <a href="#" class="li" style="border-bottom:1px solid {{t.border}}">
              <span class="col" style="flex:1;min-width:0"><span style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{c.title}}</span><span class="cap" style="color:{{t.mfg}}">{{c.time}}</span></span>
              <sc-if value="{{c.hasTag}}" hint-placeholder-val="{{true}}"><span class="badge" style="background:{{t.active}}">{{c.tag}}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{s.loading}}" hint-placeholder-val="{{false}}">
        <div class="col" style="gap:14px;padding-top:10px">
          <span class="sk" style="height:14px;width:70%;background:{{t.active}}"></span><span class="sk" style="height:14px;width:55%;background:{{t.active}}"></span><span class="sk" style="height:14px;width:62%;background:{{t.active}}"></span>
        </div>
      </sc-if>
      <sc-if value="{{s.empty}}" hint-placeholder-val="{{false}}">
        <div class="col" style="align-items:center;text-align:center;gap:8px;padding:20px 8px">
          <div class="row" aria-hidden="true" style="justify-content:center;width:96px;height:64px;border-radius:12px;border:1px dashed {{t.border}};color:{{t.mfg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
          <span class="sub">还没有对话</span>
          <span style="color:{{t.mfg}}">问一个问题，或上传文档让助手帮你整理要点。</span>
          <a href="#" class="btn" style="margin-top:4px;background:{{t.primary}};color:{{t.pfg}}">开始第一次对话</a>
        </div>
      </sc-if>
      <sc-if value="{{s.error}}" hint-placeholder-val="{{false}}">
        <div role="alert" class="col" style="gap:8px;margin-top:8px;padding:12px 14px;border-radius:8px;border:1px solid {{t.border}};background:{{t.card}};color:{{t.destructive}}">
          <span style="font-weight:500">最近对话加载失败</span>
          <span>网络或服务暂时不可用。</span>
          <button type="button" class="btn btn-sm" style="align-self:flex-start;box-shadow:inset 0 0 0 1px {{t.border}};color:{{t.fg}}">重试</button>
        </div>
      </sc-if>
    </section>
  </main>

  <sc-if value="{{drawerOpen}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;z-index:40;background:{{t.scrim}}" onClick="{{closeDrawer}}"></div>
    <aside id="drawer" role="dialog" aria-modal="true" aria-label="导航" class="col" style="position:absolute;z-index:50;top:0;bottom:0;left:0;width:300px;padding:12px;gap:16px;background:{{t.drawer}};box-shadow:{{t.sh5}}">
      <div class="row" style="justify-content:space-between;height:36px;padding-left:4px">
        <span class="row" style="gap:8px"><span class="row" style="justify-content:center;width:24px;height:24px;border-radius:6px;background:{{t.primary}};color:{{t.pfg}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg></span><span class="sub">SaaS 模板</span></span>
        <button type="button" class="ib hv" aria-label="关闭导航" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <button type="button" class="row hv" aria-label="切换工作区，当前：项目 A" style="gap:8px;padding:8px;border-radius:8px;text-align:left;box-shadow:inset 0 0 0 1px {{t.border}}">
        <span class="row cap" style="justify-content:center;width:24px;height:24px;border-radius:6px;background:{{t.active}};font-weight:600">A</span>
        <span class="col" style="flex:1"><span style="font-weight:500">项目 A</span><span class="cap" style="color:{{t.mfg}}">团队空间 · 3 位成员</span></span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.mfg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg>
      </button>
      <nav class="col" aria-label="工作区" style="gap:16px;flex:1">
        <div class="col" style="gap:2px">
          <span class="grp" style="color:{{t.mfg}}">工具</span>
          <a href="#" class="ni hv" aria-current="page" onClick="{{closeDrawer}}" style="background:{{t.active}};font-weight:500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>工作台</a>
          <a href="#" class="ni hv" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>对话</a>
          <a href="#" class="ni hv" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>图片生成</a>
        </div>
        <div class="col" style="gap:2px">
          <span class="grp" style="color:{{t.mfg}}">内容</span>
          <a href="#" class="ni hv" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8"></path></svg>文档</a>
          <a href="#" class="ni hv" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>报告</a>
        </div>
        <div class="col" style="gap:2px">
          <span class="grp" style="color:{{t.mfg}}">设置</span>
          <a href="#" class="ni hv" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>账单与积分</a>
          <a href="#" class="ni hv" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"></path></svg>用量</a>
          <a href="#" class="ni hv" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"></circle><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"></path></svg>API 密钥</a>
          <a href="#" class="ni hv" onClick="{{closeDrawer}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>空间设置</a>
        </div>
      </nav>
      <div class="row" style="gap:10px;padding:12px;border-radius:12px;background:{{t.card}};box-shadow:{{t.sh2}}">
        <span class="col" style="flex:1"><span class="sub">升级到专业版</span><span class="cap" style="color:{{t.mfg}}">每月订阅积分，解锁全部模型</span></span>
        <a href="#" class="btn btn-sm" style="background:{{t.primary}};color:{{t.pfg}}">查看</a>
      </div>
      <button type="button" class="row hv" aria-label="账户菜单：示例用户" style="gap:10px;padding:6px 8px;border-radius:8px;text-align:left">
        <span class="row cap" style="justify-content:center;width:28px;height:28px;border-radius:9999px;background:{{t.active}};font-weight:600">示</span>
        <span class="col"><span style="font-weight:500">示例用户</span><span class="cap" style="color:{{t.mfg}}">user@example.com</span></span>
      </button>
    </aside>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["normal","empty","loading","error"],"default":"normal"},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525', '#2c2c2c', '#333333', '#3a3a3a', '#414141', '#484848'],
    fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    destructive: '#fca5a5', success: 'oklch(0.723 0.219 149.579)', successSoft: 'rgba(34,197,94,0.15)',
    border: 'rgba(245,245,245,0.12)', hover: 'rgba(255,255,255,0.06)', active: 'rgba(255,255,255,0.1)', scrim: 'rgba(0,0,0,0.8)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff'],
    fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    destructive: '#b91c1c', success: 'oklch(0.527 0.154 150.069)', successSoft: 'rgba(21,128,61,0.1)',
    border: 'rgba(23,23,23,0.12)', hover: 'rgba(0,0,0,0.04)', active: 'rgba(0,0,0,0.07)', scrim: 'rgba(0,0,0,0.4)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2]; t.drawer = t.s[4];
  t.sh2 = dark ? 'inset 0 1px 0 0 rgba(255,255,255,0.01), inset 0 0 0 1px rgba(255,255,255,0.02), 0 1px 1px -0.5px rgba(0,0,0,0.18)' : '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06)';
  t.sh5 = dark ? 'inset 0 1px 0 0 rgba(255,255,255,0.04), inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 0 1px rgba(0,0,0,0.16), 0 1px 1px -0.5px rgba(0,0,0,0.18), 0 3px 3px -1.5px rgba(0,0,0,0.18), 0 6px 6px -3px rgba(0,0,0,0.18), 0 12px 12px -6px rgba(0,0,0,0.18)' : '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06), 0 3px 3px -1.5px rgba(0,0,0,0.06), 0 6px 6px -3px rgba(0,0,0,0.06), 0 12px 12px -6px rgba(0,0,0,0.06)';
  return t;
}

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var t = uiTokens(!!this.props.dark);
    var mode = this.props.state || 'normal';
    var s = {
      normal: mode === 'normal', empty: mode === 'empty', loading: mode === 'loading', error: mode === 'error',
      ready: mode !== 'loading', balReady: mode === 'normal' || mode === 'empty'
    };
    var open = !!st.drawer;
    return {
      t: t, s: s,
      drawerOpen: open, drawerStr: open ? 'true' : 'false',
      openDrawer: function () { self.setState({ drawer: true }); },
      closeDrawer: function () { self.setState({ drawer: false }); },
      claimVisible: mode !== 'loading' && mode !== 'error',
      bal: mode === 'empty'
        ? { total: '50', parts: [{ label: '订阅', value: '—' }, { label: '积分包', value: '0' }, { label: '免费', value: '50' }] }
        : { total: '1,280', parts: [{ label: '订阅', value: '800' }, { label: '积分包', value: '400' }, { label: '免费', value: '80' }] },
      recent: [
        { title: '季度报告要点整理', tag: '季度报告', time: '3 分钟前' },
        { title: '项目 A 周会纪要', tag: '项目 A', time: '昨天' },
        { title: '竞品调研提纲', tag: '文档助手', time: '11-07' },
        { title: '客户邮件润色', tag: '', time: '11-05' }
      ].map(function (r) { r.hasTag = !!r.tag; return r; })
    };
  }
}
</script>
</body>
</html>
