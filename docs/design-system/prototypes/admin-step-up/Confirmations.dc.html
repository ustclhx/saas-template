<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>待确认列表（桌面）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:1440px;height:900px;display:flex;overflow:hidden}
button{font:inherit;color:inherit;margin:0;cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-weight:500;white-space:nowrap}
.tab{height:32px;padding:0 12px;border-radius:6px;font-weight:500;font-size:13px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;font-size:12px;line-height:16px;font-weight:500}
th,td{text-align:left;padding:12px;font-size:13px;vertical-align:middle}
th{font-weight:500}
.sk{height:12px;border-radius:4px}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.bg}};color:{{t.fg}}">
  <nav class="col" aria-label="后台导航" style="width:232px;padding:16px 12px;gap:2px;background:{{t.panel}};border-right:1px solid {{t.border}}">
    <span class="sub" style="padding:8px 10px 16px">Acme 后台</span>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
      <a href="#" class="row" style="height:36px;padding:0 10px;border-radius:8px;gap:8px;text-decoration:none;color:{{n.color}};background:{{n.bg}};font-weight:{{n.weight}}"><span style="flex:1">{{n.label}}</span><sc-if value="{{n.count}}" hint-placeholder-val="{{false}}"><span class="cap" style="min-width:20px;height:20px;padding:0 6px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;background:{{t.primary}};color:{{t.pfg}};font-weight:600">{{n.count}}</span></sc-if></a>
    </sc-for>
  </nav>
  <main class="col" style="flex:1;min-width:0">
    <header class="row" style="height:56px;padding:0 24px;gap:12px;border-bottom:1px solid {{t.border}};background:{{t.panel}}">
      <h1 class="sub" style="margin:0;flex:1;font-size:16px">待确认</h1>
      <span class="cap" style="color:{{t.mfg}}">AI 通过 MCP 发起的敏感操作，管理员确认后才执行</span>
    </header>
    <div class="col" style="padding:24px;gap:16px">
      <div role="tablist" aria-label="列表" class="row" style="gap:4px;padding:4px;border-radius:8px;background:{{t.secondary}};align-self:flex-start">
        <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2">
          <button type="button" role="tab" aria-selected="{{tb.sel}}" class="tab" onClick="{{tb.pick}}" style="background:{{tb.bg}};color:{{tb.color}}">{{tb.label}}</button>
        </sc-for>
      </div>
      <div class="col" style="border-radius:12px;overflow:hidden;background:{{t.card}};box-shadow:inset 0 0 0 1px {{t.border}}">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="color:{{t.mfg}};border-bottom:1px solid {{t.border}}"><th>操作</th><th>工具</th><th>发起令牌</th><th>发起时间</th><th>{{col5}}</th><th style="text-align:right">　</th></tr></thead>
          <tbody>
            <sc-if value="{{isRows}}" hint-placeholder-val="{{true}}">
              <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
                <tr style="border-bottom:1px solid {{t.border}}">
                  <td style="font-weight:500">{{row.summary}}</td>
                  <td class="mono">{{row.tool}}</td>
                  <td><span>{{row.token}}</span> <span class="mono" style="color:{{t.mfg}}">{{row.prefix}}</span></td>
                  <td style="color:{{t.mfg}}">{{row.at}}</td>
                  <td><span class="badge" style="background:{{row.sbg}};color:{{row.sfg}}">{{row.status}}</span></td>
                  <td style="text-align:right"><a href="#" class="btn" style="text-decoration:none;box-shadow:inset 0 0 0 1px {{t.border}}">{{row.action}}</a></td>
                </tr>
              </sc-for>
            </sc-if>
            <sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
              <sc-for list="{{skel}}" as="k" hint-placeholder-count="4">
                <tr style="border-bottom:1px solid {{t.border}}"><td><div class="sk" style="width:220px;background:{{t.secondary}}"></div></td><td><div class="sk" style="width:110px;background:{{t.secondary}}"></div></td><td><div class="sk" style="width:160px;background:{{t.secondary}}"></div></td><td><div class="sk" style="width:60px;background:{{t.secondary}}"></div></td><td><div class="sk" style="width:70px;background:{{t.secondary}}"></div></td><td></td></tr>
              </sc-for>
            </sc-if>
          </tbody>
        </table>
        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
          <div class="col" style="gap:6px;padding:48px;align-items:center;text-align:center"><span class="sub">没有待确认的操作</span><span class="cap" style="color:{{t.mfg}}">AI 调用敏感工具时会出现在这里，并给你一条确认链接。</span></div>
        </sc-if>
        <sc-if value="{{isError}}" hint-placeholder-val="{{false}}">
          <div role="alert" class="col" style="gap:10px;padding:40px;align-items:center;text-align:center"><span class="sub">列表加载失败</span><span class="cap" style="color:{{t.mfg}}">请稍后重试。请求编号 req_8f2c…</span><button type="button" class="btn" style="box-shadow:inset 0 0 0 1px {{t.border}}">重试</button></div>
        </sc-if>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["normal","empty","loading","error"],"default":"normal"},"$preview":{"width":1440,"height":900}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    destructive: '#fca5a5', dangerBg: 'rgba(252,165,165,0.12)', ok: '#86efac', okBg: 'rgba(134,239,172,0.12)', warn: '#fcd34d', warnBg: 'rgba(252,211,77,0.12)', border: 'rgba(245,245,245,0.12)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    destructive: '#b91c1c', dangerBg: 'rgba(185,28,28,0.08)', ok: '#15803d', okBg: 'rgba(21,128,61,0.1)', warn: '#a16207', warnBg: 'rgba(234,179,8,0.12)', border: 'rgba(23,23,23,0.12)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#2a2a2a' : '#f4f4f5';
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var t = uiTokens(!!this.props.dark);
    var s = this.props.state || 'normal';
    var st = this.state || {};
    var tab = st.tab || 'pending';
    var pending = [
      { summary: '为 lin@example.com 增加 500 积分', tool: 'credits.adjust', token: 'Claude Code · 工作笔记本', prefix: 'xat_3f9a…', at: '14:05', status: '剩余 23 分钟', sbg: t.warnBg, sfg: t.warn, action: '查看并确认' },
      { summary: '批准退款申请 #R-1042（¥68.00）', tool: 'refunds.review', token: 'Claude Code · 工作笔记本', prefix: 'xat_3f9a…', at: '13:58', status: '剩余 16 分钟', sbg: t.warnBg, sfg: t.warn, action: '查看并确认' }
    ];
    var history = [
      { summary: '把模型「通用模型」输入价改为 2 积分 / 千 token', tool: 'models.update', token: '发版检查', prefix: 'xat_81d0…', at: '昨天 18:20', status: '已完成', sbg: t.okBg, sfg: t.ok, action: '查看' },
      { summary: '更新设置 notifications.telegramToken', tool: 'settings.set', token: 'Claude Code · 工作笔记本', prefix: 'xat_3f9a…', at: '昨天 11:02', status: '已拒绝', sbg: t.secondary, sfg: t.mfg, action: '查看' },
      { summary: '为 kai@example.com 扣除 200 积分', tool: 'credits.adjust', token: '旧笔记本', prefix: 'xat_0c55…', at: '11 月 22 日', status: '未执行：令牌已吊销', sbg: t.dangerBg, sfg: t.destructive, action: '查看' },
      { summary: '批准退款申请 #R-1031（¥29.00）', tool: 'refunds.review', token: 'Claude Code · 工作笔记本', prefix: 'xat_3f9a…', at: '11 月 21 日', status: '已过期', sbg: t.secondary, sfg: t.mfg, action: '查看' }
    ];
    var rows = tab === 'pending' ? pending : history;
    return {
      t: t,
      nav: [['概览', 0], ['用户', 0], ['订单', 0], ['积分', 0], ['待确认', s === 'empty' ? 0 : 2, true], ['API 令牌', 0], ['审计日志', 0]].map(function (n) {
        return { label: n[0], count: n[1] ? String(n[1]) : '', color: n[2] ? t.fg : t.mfg, bg: n[2] ? t.secondary : 'transparent', weight: n[2] ? 600 : 400 };
      }),
      tabs: [['pending', '待确认 2'], ['history', '历史']].map(function (x) {
        var sel = x[0] === tab;
        return { label: x[1], sel: sel ? 'true' : 'false', bg: sel ? t.card : 'transparent', color: sel ? t.fg : t.mfg, pick: function () { self.setState({ tab: x[0] }); } };
      }),
      col5: tab === 'pending' ? '有效期' : '结果',
      rows: rows,
      isRows: s === 'normal',
      isLoading: s === 'loading',
      skel: [1, 2, 3, 4],
      isEmpty: s === 'empty',
      isError: s === 'error'
    };
  }
}
</script>
</body>
</html>
