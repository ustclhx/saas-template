<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>确认 AI 发起的操作（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;margin:0;cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:8px;font-weight:500}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;font-size:12px;line-height:16px;font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.panel}};color:{{t.fg}}">
  <header class="row" style="height:56px;padding:0 6px;gap:4px;border-bottom:1px solid {{t.border}}">
    <a href="#" aria-label="返回待确认列表" class="row" style="width:44px;height:44px;justify-content:center;border-radius:8px;color:{{t.fg}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></a>
    <h1 class="sub" style="margin:0;flex:1;font-size:16px">确认 AI 发起的操作</h1>
  </header>
  <div class="col" style="flex:1;overflow:auto;padding:16px;gap:12px">
    <sc-if value="{{banner}}" hint-placeholder-val="{{false}}">
      <div role="status" class="cap" style="padding:10px 12px;border-radius:8px;background:{{bannerBg}};color:{{bannerFg}};font-weight:500">{{banner}}</div>
    </sc-if>
    <div class="col" style="padding:14px;border-radius:10px;background:{{t.card}};box-shadow:inset 0 0 0 1px {{t.border}}">
      <div class="row" style="gap:8px;padding-bottom:8px"><span class="sub" style="flex:1">为 lin@example.com 增加 500 积分</span><span class="badge" style="background:{{statusBg}};color:{{statusFg}}">{{statusLabel}}</span></div>
      <div class="kv cap" style="border-top:1px solid {{t.border}}"><span style="color:{{t.mfg}}">工具</span><span class="mono">credits.adjust</span></div>
      <div class="kv cap" style="border-top:1px solid {{t.border}}"><span style="color:{{t.mfg}}">空间</span><span>林的工作区</span></div>
      <div class="kv cap" style="border-top:1px solid {{t.border}}"><span style="color:{{t.mfg}}">积分余额</span><span>1,200 → <b>1,700</b></span></div>
      <div class="kv cap" style="border-top:1px solid {{t.border}}"><span style="color:{{t.mfg}}">原因</span><span>活动补偿：11 月故障</span></div>
      <div class="kv cap" style="border-top:1px solid {{t.border}}"><span style="color:{{t.mfg}}">发起令牌</span><span class="mono">xat_3f9a1c7e…</span></div>
      <div class="kv cap" style="border-top:1px solid {{t.border}}"><span style="color:{{t.mfg}}">有效期</span><span style="color:{{expiryColor}};font-weight:500">{{expiry}}</span></div>
    </div>
    <sc-if value="{{notOwner}}" hint-placeholder-val="{{false}}">
      <div role="note" class="cap" style="padding:10px 12px;border-radius:8px;background:{{t.secondary}}">由另一位管理员的令牌发起，只有发起人能确认。你可以拒绝。</div>
    </sc-if>
    <p class="cap" style="margin:0;color:{{t.mfg}}">确认时会要求重新验证。目标已被修改、或令牌已吊销 / 过期时不会执行。</p>
  </div>
  <sc-if value="{{actions}}" hint-placeholder-val="{{true}}">
    <div class="col" style="gap:8px;padding:12px 16px 20px;border-top:1px solid {{t.border}};background:{{t.card}}">
      <sc-if value="{{canConfirm}}" hint-placeholder-val="{{true}}"><button type="button" class="btn" style="background:{{t.primary}};color:{{t.pfg}}">{{confirmLabel}}</button></sc-if>
      <button type="button" class="btn" style="color:{{t.destructive}};box-shadow:inset 0 0 0 1px {{t.border}}">拒绝</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["pending","running","done","failedRevoked","failedChanged","rejected","expired","notOwner"],"default":"pending"},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    destructive: '#fca5a5', dangerBg: 'rgba(252,165,165,0.12)', ok: '#86efac', okBg: 'rgba(134,239,172,0.12)', warn: '#fcd34d', warnBg: 'rgba(252,211,77,0.12)', border: 'rgba(245,245,245,0.12)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    destructive: '#b91c1c', dangerBg: 'rgba(185,28,28,0.08)', ok: '#15803d', okBg: 'rgba(21,128,61,0.1)', warn: '#a16207', warnBg: 'rgba(234,179,8,0.12)', border: 'rgba(23,23,23,0.12)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#2a2a2a' : '#f4f4f5';
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var t = uiTokens(!!this.props.dark);
    var s = this.props.state || 'pending';
    var map = {
      pending: ['待确认', t.warnBg, t.warn, '', null, null],
      notOwner: ['待确认', t.warnBg, t.warn, '', null, null],
      running: ['执行中', t.secondary, t.fg, '', null, null],
      done: ['已完成', t.okBg, t.ok, '已执行：余额现在是 1,700。', t.okBg, t.ok],
      failedRevoked: ['未执行', t.dangerBg, t.destructive, '没有执行：发起它的令牌已经吊销。', t.dangerBg, t.destructive],
      failedChanged: ['未执行', t.dangerBg, t.destructive, '没有执行：余额在发起后变了，请让 AI 重新发起。', t.dangerBg, t.destructive],
      rejected: ['已拒绝', t.secondary, t.mfg, '已拒绝，不会执行。', t.secondary, t.fg],
      expired: ['已过期', t.secondary, t.mfg, '已过期，不会执行。', t.secondary, t.fg]
    };
    var m = map[s] || map.pending;
    var open = s === 'pending' || s === 'notOwner' || s === 'running';
    return {
      t: t,
      statusLabel: m[0], statusBg: m[1], statusFg: m[2],
      banner: m[3], bannerBg: m[4], bannerFg: m[5],
      expiry: open ? '剩余 23 分钟' : '30 分钟',
      expiryColor: open ? t.warn : t.mfg,
      notOwner: s === 'notOwner',
      actions: open,
      canConfirm: s !== 'notOwner',
      confirmLabel: s === 'running' ? '执行中…' : '确认执行'
    };
  }
}
</script>
</body>
</html>
