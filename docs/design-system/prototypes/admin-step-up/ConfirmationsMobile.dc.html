<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>待确认列表（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;margin:0;cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.tab{flex:1;height:36px;border-radius:6px;font-weight:500;font-size:13px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;font-size:12px;line-height:16px;font-weight:500}
.sk{height:12px;border-radius:4px}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.panel}};color:{{t.fg}}">
  <header class="row" style="height:56px;padding:0 6px;gap:4px;border-bottom:1px solid {{t.border}}">
    <button type="button" aria-label="打开后台导航" class="row" style="width:44px;height:44px;justify-content:center;border-radius:8px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <h1 class="sub" style="margin:0;flex:1;font-size:16px">待确认</h1>
  </header>
  <div class="col" style="flex:1;overflow:auto;padding:16px;gap:12px">
    <div role="tablist" aria-label="列表" class="row" style="gap:4px;padding:4px;border-radius:8px;background:{{t.secondary}}">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{tb.sel}}" class="tab" onClick="{{tb.pick}}" style="background:{{tb.bg}};color:{{tb.color}}">{{tb.label}}</button>
      </sc-for>
    </div>
    <sc-if value="{{isRows}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
        <a href="#" class="col" style="gap:8px;padding:12px;border-radius:10px;text-decoration:none;color:{{t.fg}};background:{{t.card}};box-shadow:inset 0 0 0 1px {{t.border}}">
          <span style="font-weight:500">{{row.summary}}</span>
          <div class="row" style="gap:6px;flex-wrap:wrap"><span class="mono" style="color:{{t.mfg}}">{{row.tool}}</span><span class="badge" style="background:{{row.sbg}};color:{{row.sfg}}">{{row.status}}</span></div>
          <span class="cap" style="color:{{t.mfg}}">{{row.token}} · {{row.at}}</span>
        </a>
      </sc-for>
    </sc-if>
    <sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{skel}}" as="k" hint-placeholder-count="3">
        <div class="col" style="gap:10px;padding:14px;border-radius:10px;background:{{t.card}};box-shadow:inset 0 0 0 1px {{t.border}}"><div class="sk" style="width:80%;background:{{t.secondary}}"></div><div class="sk" style="width:50%;background:{{t.secondary}}"></div></div>
      </sc-for>
    </sc-if>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div class="col" style="gap:6px;padding:32px 16px;align-items:center;text-align:center"><span class="sub">没有待确认的操作</span><span class="cap" style="color:{{t.mfg}}">AI 调用敏感工具时会出现在这里。</span></div>
    </sc-if>
    <sc-if value="{{isError}}" hint-placeholder-val="{{false}}">
      <div role="alert" class="col" style="gap:10px;padding:32px 16px;align-items:center;text-align:center"><span class="sub">列表加载失败</span><button type="button" style="height:44px;padding:0 16px;border-radius:8px;font-weight:500;box-shadow:inset 0 0 0 1px {{t.border}}">重试</button></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["normal","empty","loading","error"],"default":"normal"},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    destructive: '#fca5a5', dangerBg: 'rgba(252,165,165,0.12)', ok: '#86efac', okBg: 'rgba(134,239,172,0.12)', warn: '#fcd34d', warnBg: 'rgba(252,211,77,0.12)', border: 'rgba(245,245,245,0.12)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    destructive: '#b91c1c', dangerBg: 'rgba(185,28,28,0.08)', ok: '#15803d', okBg: 'rgba(21,128,61,0.1)', warn: '#a16207', warnBg: 'rgba(234,179,8,0.12)', border: 'rgba(23,23,23,0.12)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#2a2a2a' : '#f4f4f5';
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var t = uiTokens(!!this.props.dark);
    var s = this.props.state || 'normal';
    var tab = (this.state || {}).tab || 'pending';
    var pending = [
      { summary: '为 lin@example.com 增加 500 积分', tool: 'credits.adjust', token: '工作笔记本', at: '14:05', status: '剩余 23 分钟', sbg: t.warnBg, sfg: t.warn },
      { summary: '批准退款申请 #R-1042（¥68.00）', tool: 'refunds.review', token: '工作笔记本', at: '13:58', status: '剩余 16 分钟', sbg: t.warnBg, sfg: t.warn }
    ];
    var history = [
      { summary: '把「通用模型」输入价改为 2 积分 / 千 token', tool: 'models.update', token: '发版检查', at: '昨天 18:20', status: '已完成', sbg: t.okBg, sfg: t.ok },
      { summary: '更新设置 notifications.telegramToken', tool: 'settings.set', token: '工作笔记本', at: '昨天 11:02', status: '已拒绝', sbg: t.secondary, sfg: t.mfg },
      { summary: '为 kai@example.com 扣除 200 积分', tool: 'credits.adjust', token: '旧笔记本', at: '11 月 22 日', status: '未执行：令牌已吊销', sbg: t.dangerBg, sfg: t.destructive }
    ];
    return {
      t: t,
      tabs: [['pending', '待确认 2'], ['history', '历史']].map(function (x) {
        var sel = x[0] === tab;
        return { label: x[1], sel: sel ? 'true' : 'false', bg: sel ? t.card : 'transparent', color: sel ? t.fg : t.mfg, pick: function () { self.setState({ tab: x[0] }); } };
      }),
      rows: tab === 'pending' ? pending : history,
      isRows: s === 'normal', isLoading: s === 'loading', skel: [1, 2, 3], isEmpty: s === 'empty', isError: s === 'error'
    };
  }
}
</script>
</body>
</html>
