<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>语言提示条进入动画</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
sc-if,sc-for{display:contents}
svg{flex-shrink:0}
@keyframes lp-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lp-exit{from{opacity:1;transform:none}to{opacity:0;transform:translateY(4px)}}
@keyframes lp-fade-in{from{opacity:0}to{opacity:1}}
@keyframes lp-fade-out{from{opacity:1}to{opacity:0}}
.lp-enter{animation:lp-enter 160ms cubic-bezier(0.2,0,0,1) both}
.lp-exit{animation:lp-exit 120ms ease-in both}
.lp-fade-in{animation:lp-fade-in 160ms linear both}
.lp-fade-out{animation:lp-fade-out 120ms linear both}
</style>
</helmet>
<div style="width: 1440px; min-height: 760px; padding: 48px; background: #fafafa; color: #171717; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">进入与退出</h1>
    <p style="margin: 0; color: #6b6b6b; max-width: 1000px">水合完成 → 浏览器空闲后挂载（requestIdleCallback，最长等 1.5s，不与首屏渲染争抢）→ 进入 160ms → 停留到用户点击链接或关闭 → 退出 120ms 后卸载。纯 CSS 动画（营销页不加载 motion）；时长对应 <code>spring.moderate</code> 的进入 / 退出档位。不抢焦点，不使用实时播报区域。</p>
  </div>

  <sc-for list="{{lanes}}" as="lane" hint-placeholder-count="2">
    <section aria-label="{{lane.title}}" style="display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06)">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600">{{lane.title}}</h2>
          <p style="margin: 0; color: #6b6b6b">{{lane.desc}}</p>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" onClick="{{lane.replay}}" style="height: 32px; padding: 0 12px; border: 1px solid rgba(23,23,23,0.12); border-radius: 8px; background: #ffffff; color: #171717; font: inherit; font-weight: 500">重播进入</button>
          <button type="button" onClick="{{lane.dismiss}}" style="height: 32px; padding: 0 12px; border: 1px solid rgba(23,23,23,0.12); border-radius: 8px; background: #ffffff; color: #171717; font: inherit; font-weight: 500">演示关闭</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; align-items: end">
        <sc-for list="{{lane.frames}}" as="f" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="position: relative; height: 112px; border-radius: 8px; background: #fafafa; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); overflow: hidden">
              <div style="position: absolute; left: 12px; right: 12px; bottom: {{f.bottom}}; opacity: {{f.opacity}}; padding: 10px 12px; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06), 0 3px 3px -1.5px rgba(0,0,0,0.06), 0 6px 6px -3px rgba(0,0,0,0.06), 0 12px 12px -6px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 6px">
                <span style="font-weight: 500; font-size: 12px; line-height: 16px">本页有中文版本</span>
                <span style="align-self: flex-start; height: 20px; width: 64px; border-radius: 6px; background: #171717"></span>
              </div>
            </div>
            <p style="margin: 0; font-size: 12px; line-height: 16px; color: #6b6b6b">{{f.label}}</p>
          </div>
        </sc-for>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="position: relative; height: 112px; border-radius: 8px; background: #fafafa; box-shadow: inset 0 0 0 1px #3b82f6; overflow: hidden">
            <sc-if value="{{lane.visible}}" hint-placeholder-val="{{true}}">
              <div class="{{lane.cls}}" style="position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06), 0 3px 3px -1.5px rgba(0,0,0,0.06), 0 6px 6px -3px rgba(0,0,0,0.06), 0 12px 12px -6px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 6px">
                <span style="font-weight: 500; font-size: 12px; line-height: 16px">本页有中文版本</span>
                <span style="align-self: flex-start; height: 20px; width: 64px; border-radius: 6px; background: #171717"></span>
              </div>
            </sc-if>
          </div>
          <p style="margin: 0; font-size: 12px; line-height: 16px; color: #3362b1; font-weight: 500">实时演示（点右上按钮）</p>
        </div>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 16px; color: #6b6b6b"><code>{{lane.css}}</code></p>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: 'in', b: 'in' };
  }
  run(key, phase) {
    this.setState({ [key]: 'off' });
    setTimeout(() => this.setState({ [key]: phase }), 60);
  }
  close(key) {
    this.setState({ [key]: 'out' });
    setTimeout(() => this.setState({ [key]: 'off' }), 140);
  }
  renderVals() {
    const s = this.state;
    return {
      lanes: [
        {
          title: '默认：淡入 + 上移 8px',
          desc: '进入 160ms（减速曲线），退出 120ms 淡出并下移 4px；不缩放、不弹跳。',
          frames: [
            { label: '0ms · 不透明度 0 · 下移 8px', bottom: '4px', opacity: '0.08' },
            { label: '80ms · 0.7 · 下移 2px', bottom: '10px', opacity: '0.7' },
            { label: '160ms · 1 · 到位', bottom: '12px', opacity: '1' },
            { label: '关闭 · 120ms 淡出 · 下移 4px', bottom: '8px', opacity: '0.35' }
          ],
          visible: s.a !== 'off',
          cls: s.a === 'out' ? 'lp-exit' : 'lp-enter',
          replay: () => this.run('a', 'in'),
          dismiss: () => this.close('a'),
          css: 'animate: float-enter 160ms（translateY 8px→0, opacity 0→1）；关闭 float-exit 120ms'
        },
        {
          title: 'prefers-reduced-motion: reduce：只淡入淡出',
          desc: '去掉位移，保留不透明度变化（与 UiRoot 的 reducedMotion="user" 一致）；位置始终固定。',
          frames: [
            { label: '0ms · 不透明度 0', bottom: '12px', opacity: '0.08' },
            { label: '80ms · 0.5', bottom: '12px', opacity: '0.5' },
            { label: '160ms · 1', bottom: '12px', opacity: '1' },
            { label: '关闭 · 120ms 淡出', bottom: '12px', opacity: '0.35' }
          ],
          visible: s.b !== 'off',
          cls: s.b === 'out' ? 'lp-fade-out' : 'lp-fade-in',
          replay: () => this.run('b', 'in'),
          dismiss: () => this.close('b'),
          css: 'motion-reduce: 变体改用 float-fade-in / float-fade-out（只有 opacity），不移动'
        }
      ]
    };
  }
}
</script>
</body>
</html>
