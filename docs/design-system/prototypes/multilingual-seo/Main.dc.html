<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>语言提示条（桌面）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
sc-if,sc-for{display:contents}
svg{flex-shrink:0}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 1440px; height: 900px; background: {{t.bg}}; color: {{t.fg}}; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased">
  <header data-link-zone="nav" style="height: 64px; border-bottom: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: space-between; padding: 0 48px">
    <div style="display: flex; align-items: center; gap: 40px">
      <a href="#" style="font-size: 16px; line-height: 22px; font-weight: 700">Acme</a>
      <nav aria-label="Main" style="display: flex; gap: 24px; color: {{t.muted}}">
        <a href="#" style="color: {{t.fg}}; font-weight: 500">Pricing</a><a href="#">Blog</a><a href="#">Docs</a>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="#" style="display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 8px">Sign in</a>
      <a href="#" style="display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 8px; background: {{t.primary}}; color: {{t.primaryFg}}; font-weight: 500">Get started</a>
    </div>
  </header>

  <main style="max-width: 1040px; margin: 0 auto; padding: 72px 0 0; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center">
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">Pricing</h1>
      <p style="margin: 0; color: {{t.muted}}; font-size: 16px; line-height: 24px">Every plan includes the AI workspace and usage-based credits.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{plans}}" as="plan" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 12px; background: {{t.card}}; box-shadow: {{t.shadow2}}; min-height: 300px">
          <p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600">{{plan.name}}</p>
          <p style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">[PRICE]</p>
          <p style="margin: 0; color: {{t.muted}}">[Plan summary]</p>
          <span style="margin-top: auto; display: inline-flex; align-items: center; justify-content: center; height: 36px; border-radius: 8px; border: 1px solid {{t.border}}; font-weight: 500">Choose {{plan.name}}</span>
        </div>
      </sc-for>
    </div>
  </main>

  <!-- 现有浮动控件：左下语言选择（LanguageControls floating），右下主题切换与 Ask AI（营销页） -->
  <div data-link-zone="nav" style="position: absolute; left: 16px; bottom: 16px; padding: 4px; border-radius: 8px; background: {{t.bg}}; box-shadow: {{t.shadow2}}">
    <button type="button" aria-label="Language" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; width: 132px; height: 32px; padding: 0 10px; border: 1px solid {{t.border}}; border-radius: 8px; background: {{t.card}}; color: {{t.fg}}; font: inherit">English<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
  </div>
  <a href="#" aria-label="Ask AI about this site" style="position: absolute; right: 16px; bottom: 72px; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 16px; border-radius: 9999px; background: {{t.primary}}; color: {{t.primaryFg}}; font-weight: 500; box-shadow: {{t.shadow5}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>Ask AI</a>
  <div role="radiogroup" aria-label="Theme" style="position: absolute; right: 16px; bottom: 16px; display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: {{t.card}}; box-shadow: {{t.shadow2}}">
    <button type="button" role="radio" aria-checked="{{lightChecked}}" aria-label="Light" style="width: 36px; height: 36px; border: 0; border-radius: 7px; background: {{t.lightBtn}}; color: {{t.fg}}; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg></button>
    <button type="button" role="radio" aria-checked="{{darkChecked}}" aria-label="Dark" style="width: 36px; height: 36px; border: 0; border-radius: 7px; background: {{t.darkBtn}}; color: {{t.fg}}; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
    <button type="button" role="radio" aria-checked="false" aria-label="System" style="width: 36px; height: 36px; border: 0; border-radius: 7px; background: transparent; color: {{t.muted}}; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></button>
  </div>

  <!-- LanguagePrompt：水合后挂载，position: fixed，不占文档流；文案用建议语言（lang="zh"） -->
  <aside lang="zh" aria-label="语言建议" data-language-prompt="" style="position: absolute; left: {{p.left}}; right: {{p.right}}; bottom: {{p.bottom}}; z-index: 30; width: 360px; padding: 12px 8px 14px 14px; border-radius: 12px; background: {{t.surface5}}; box-shadow: {{t.shadow5}}; display: flex; gap: 10px; align-items: flex-start">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-weight: 500">本页有中文版本</p>
      <a href="#" hreflang="zh" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 12px; border-radius: 8px; background: {{t.primary}}; color: {{t.primaryFg}}; font-weight: 500; text-decoration: none">查看中文版<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
    </div>
    <button type="button" aria-label="关闭语言提示" style="width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: {{t.muted}}; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"corner":{"editor":"enum","options":["right","left"],"default":"right"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const corner = this.props.corner ?? 'right';
    const light = {
      bg: '#fafafa', fg: '#171717', muted: '#6b6b6b', card: '#ffffff', surface5: '#ffffff',
      border: 'rgba(23,23,23,0.12)', primary: '#171717', primaryFg: '#fafafa',
      shadow2: '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06)',
      shadow5: '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06), 0 3px 3px -1.5px rgba(0,0,0,0.06), 0 6px 6px -3px rgba(0,0,0,0.06), 0 12px 12px -6px rgba(0,0,0,0.06)',
      lightBtn: 'rgba(0,0,0,0.07)', darkBtn: 'transparent'
    };
    const darkT = {
      bg: '#171717', fg: '#f5f5f5', muted: '#b0b0b0', card: '#252525', surface5: '#333333',
      border: 'rgba(245,245,245,0.12)', primary: '#f5f5f5', primaryFg: '#171717',
      shadow2: 'inset 0 1px 0 0 rgba(255,255,255,0.01), inset 0 0 0 1px rgba(255,255,255,0.02), 0 1px 1px -0.5px rgba(0,0,0,0.18)',
      shadow5: 'inset 0 1px 0 0 rgba(255,255,255,0.04), inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 0 1px rgba(0,0,0,0.16), 0 1px 1px -0.5px rgba(0,0,0,0.18), 0 3px 3px -1.5px rgba(0,0,0,0.18), 0 6px 6px -3px rgba(0,0,0,0.18), 0 12px 12px -6px rgba(0,0,0,0.18)',
      lightBtn: 'transparent', darkBtn: 'rgba(255,255,255,0.1)'
    };
    const t = dark ? darkT : light;
    // 右下：叠在 Ask AI（bottom 72 + 高 48）之上留 12px；左下：叠在语言选择（bottom 16 + 高 42）之上留 12px
    const p = corner === 'left'
      ? { left: '16px', right: 'auto', bottom: '70px' }
      : { left: 'auto', right: '16px', bottom: '132px' };
    return {
      t, p,
      lightChecked: dark ? 'false' : 'true',
      darkChecked: dark ? 'true' : 'false',
      plans: [{ name: 'Free' }, { name: 'Pro' }, { name: 'Team' }]
    };
  }
}
</script>
</body>
</html>
