<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>语言提示条（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
sc-if,sc-for{display:contents}
svg{flex-shrink:0}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; background: {{t.bg}}; color: {{t.fg}}; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased">
  <header data-link-zone="nav" style="height: 56px; border-bottom: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
    <a href="#" style="font-size: 16px; line-height: 22px; font-weight: 700">Acme</a>
    <button type="button" aria-label="Open menu" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; color: inherit; border-radius: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
  </header>

  <main style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">Pricing</h1>
      <p style="margin: 0; color: {{t.muted}}; font-size: 16px; line-height: 24px">Every plan includes the AI workspace and usage-based credits.</p>
    </div>
    <sc-for list="{{plans}}" as="plan" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 12px; background: {{t.card}}; box-shadow: {{t.shadow2}}">
        <p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600">{{plan.name}}</p>
        <p style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">[PRICE]</p>
        <p style="margin: 0; color: {{t.muted}}">[Plan summary]</p>
        <span style="display: inline-flex; align-items: center; justify-content: center; height: 40px; border-radius: 8px; border: 1px solid {{t.border}}; font-weight: 500">Choose {{plan.name}}</span>
      </div>
    </sc-for>
  </main>

  <!-- 现有：手机端 Ask AI 贴底（主题与语言在页脚设置行） -->
  <a href="#" aria-label="Ask AI about this site" style="position: absolute; right: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 16px; border-radius: 9999px; background: {{t.primary}}; color: {{t.primaryFg}}; font-weight: 500; box-shadow: {{t.shadow5}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>Ask AI</a>

  <!-- LanguagePrompt（手机）：左右 12px，叠在 Ask AI 之上 12px（无 Ask AI 时贴底 12px + safe-area） -->
  <aside lang="zh" aria-label="语言建议" data-language-prompt="" style="position: absolute; left: 12px; right: 12px; bottom: 76px; z-index: 30; padding: 12px 4px 12px 14px; border-radius: 12px; background: {{t.surface5}}; box-shadow: {{t.shadow5}}; display: flex; gap: 10px; align-items: flex-start">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-weight: 500">本页有中文版本</p>
      <a href="#" hreflang="zh" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 16px; border-radius: 8px; background: {{t.primary}}; color: {{t.primaryFg}}; font-weight: 500; text-decoration: none">查看中文版<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
    </div>
    <button type="button" aria-label="关闭语言提示" style="width: 44px; height: 44px; margin-top: -10px; border: 0; border-radius: 8px; background: transparent; color: {{t.muted}}; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const light = {
      bg: '#fafafa', fg: '#171717', muted: '#6b6b6b', card: '#ffffff', surface5: '#ffffff',
      border: 'rgba(23,23,23,0.12)', primary: '#171717', primaryFg: '#fafafa',
      shadow2: '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06)',
      shadow5: '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06), 0 3px 3px -1.5px rgba(0,0,0,0.06), 0 6px 6px -3px rgba(0,0,0,0.06), 0 12px 12px -6px rgba(0,0,0,0.06)'
    };
    const darkT = {
      bg: '#171717', fg: '#f5f5f5', muted: '#b0b0b0', card: '#252525', surface5: '#333333',
      border: 'rgba(245,245,245,0.12)', primary: '#f5f5f5', primaryFg: '#171717',
      shadow2: 'inset 0 1px 0 0 rgba(255,255,255,0.01), inset 0 0 0 1px rgba(255,255,255,0.02), 0 1px 1px -0.5px rgba(0,0,0,0.18)',
      shadow5: 'inset 0 1px 0 0 rgba(255,255,255,0.04), inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 0 1px rgba(0,0,0,0.16), 0 1px 1px -0.5px rgba(0,0,0,0.18), 0 3px 3px -1.5px rgba(0,0,0,0.18), 0 6px 6px -3px rgba(0,0,0,0.18), 0 12px 12px -6px rgba(0,0,0,0.18)'
    };
    return { t: dark ? darkT : light, plans: [{ name: 'Free' }, { name: 'Pro' }] };
  }
}
</script>
</body>
</html>
