<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent 对话列表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;height:900px;display:flex;overflow:hidden;position:relative}
button,input{font:inherit;color:inherit;margin:0}
button{cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.ttl{font-size:20px;line-height:28px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;flex-shrink:0}
.hv:hover{background:rgba(128,128,128,0.1);text-decoration:none}
.sb{width:248px;padding:12px;display:flex;flex-direction:column;gap:16px;flex-shrink:0}
.grp{font-size:12px;line-height:16px;font-weight:500;padding:0 8px;margin-bottom:4px}
.nav{display:flex;align-items:center;gap:8px;height:32px;border-radius:8px;padding:0 8px}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:9999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.main{flex:1;min-width:0;margin:8px 8px 8px 0;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.wrap{max-width:60rem;width:100%;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:20px}
.item{display:grid;grid-template-columns:1fr 160px 140px 120px 32px;align-items:center;gap:16px;min-height:56px;padding:8px 12px 8px 16px}
.pick{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;text-align:left}
.sk{border-radius:6px;animation:sk 1.6s ease-in-out infinite}
@keyframes sk{0%,100%{opacity:1}50%{opacity:0.5}}
svg{flex-shrink:0}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.bg}};color:{{t.fg}}">
  <aside class="sb" aria-label="主导航">
    <div class="row" style="height:32px;gap:8px;padding-left:4px">
      <span class="row" style="justify-content:center;width:24px;height:24px;border-radius:6px;background:{{t.primary}};color:{{t.pfg}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg></span>
      <span class="sub">SaaS 模板</span>
    </div>
    <nav class="col" aria-label="工作区" style="gap:2px;flex:1">
      <span class="grp" style="color:{{t.mfg}}">工具</span>
      <a href="#" class="nav hv" style="color:{{t.mfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>工作台</a>
      <a href="#" class="nav hv" style="color:{{t.mfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>对话</a>
      <a href="#" class="nav" aria-current="page" style="background:{{t.active}};font-weight:500"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M12 8V4M8 4h8M9 13v1M15 13v1"></path></svg>Agent</a>
      <a href="#" class="nav hv" style="color:{{t.mfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>图片生成</a>
    </nav>
    <button type="button" class="row hv" aria-label="账户菜单：示例用户" style="gap:8px;border-radius:8px;padding:6px 8px;text-align:left">
      <span class="row cap" style="justify-content:center;width:28px;height:28px;border-radius:9999px;background:{{t.active}};font-weight:600">示</span>
      <span class="col" style="flex:1;min-width:0"><span style="font-weight:500">示例用户</span><span class="cap" style="color:{{t.mfg}}">user@example.com</span></span>
    </button>
  </aside>

  <main class="main" style="background:{{t.panel}};box-shadow:{{t.sh2}}">
    <div class="wrap">
      <div class="row" style="gap:12px">
        <div class="col" style="flex:1;gap:2px">
          <h1 class="ttl" style="margin:0">Agent</h1>
          <p style="margin:0;color:{{t.mfg}}">让 AI 调用工具、分多步完成任务。对话只对你自己可见。</p>
        </div>
        <button type="button" class="btn hv" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="width:36px;padding:0;color:{{t.mfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
        <button type="button" class="btn" onClick="{{openNew}}" style="background:{{t.primary}};color:{{t.pfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>新建对话</button>
      </div>

      <sc-if value="{{s.list}}" hint-placeholder-val="{{true}}">
        <div class="col" style="border-radius:12px;background:{{t.card}};box-shadow:inset 0 0 0 1px {{t.border}};overflow:hidden">
          <div class="item cap" style="min-height:36px;color:{{t.mfg}};font-weight:500;border-bottom:1px solid {{t.border}}"><span>标题</span><span>Agent</span><span>模型</span><span>最近活动</span><span></span></div>
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
            <div class="item hv" style="{{row.sep}}">
              <a href="Main.dc.html" class="col" style="gap:2px;min-width:0"><span style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{row.title}}</span><span class="cap" style="color:{{row.stateColor}}">{{row.state}}</span></a>
              <span><span class="badge" style="background:{{t.secondary}};color:{{t.mfg}}">{{row.agent}}</span></span>
              <span style="color:{{t.mfg}}">{{row.model}}</span>
              <span style="color:{{t.mfg}}">{{row.time}}</span>
              <button type="button" class="ib hv" aria-label="对话操作：{{row.title}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></button>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{s.loading}}" hint-placeholder-val="{{false}}">
        <div class="col" style="gap:12px;padding:16px;border-radius:12px;box-shadow:inset 0 0 0 1px {{t.border}}">
          <span class="sk" style="height:16px;width:40%;background:{{t.active}}"></span>
          <span class="sk" style="height:16px;width:65%;background:{{t.active}}"></span>
          <span class="sk" style="height:16px;width:52%;background:{{t.active}}"></span>
        </div>
      </sc-if>

      <sc-if value="{{s.empty}}" hint-placeholder-val="{{false}}">
        <div class="col" style="align-items:center;text-align:center;gap:10px;padding:72px 24px;border-radius:12px;box-shadow:inset 0 0 0 1px {{t.border}}">
          <span class="row" aria-hidden="true" style="justify-content:center;width:40px;height:40px;border-radius:9999px;background:{{t.secondary}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M12 8V4M8 4h8M9 13v1M15 13v1"></path></svg></span>
          <h2 class="sub" style="margin:4px 0 0">还没有 Agent 对话</h2>
          <p style="margin:0;color:{{t.mfg}};max-width:26rem">选一个 Agent 开始。Agent 每轮会先预留积分，结束后按实际用量结算。</p>
          <button type="button" class="btn" onClick="{{openNew}}" style="margin-top:8px;background:{{t.primary}};color:{{t.pfg}}">新建对话</button>
        </div>
      </sc-if>

      <sc-if value="{{s.error}}" hint-placeholder-val="{{false}}">
        <div role="alert" class="row" style="gap:12px;padding:12px 16px;border-radius:10px;border:1px solid {{t.border}};background:{{t.card}}">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.destructive}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
          <span style="flex:1">对话列表加载失败，请稍后重试。</span>
          <button type="button" class="btn hv" style="height:32px;box-shadow:inset 0 0 0 1px {{t.border}}">重试</button>
        </div>
      </sc-if>
    </div>
  </main>

  <sc-if value="{{newOpen}}" hint-placeholder-val="{{false}}">
    <div class="row" style="position:absolute;inset:0;justify-content:center;background:{{t.overlay}}">
      <div role="dialog" aria-modal="true" aria-labelledby="nd-t" class="col" style="width:520px;gap:20px;padding:24px;border-radius:12px;background:{{t.card}};box-shadow:{{t.sh5}}">
        <div class="col" style="gap:4px">
          <h2 id="nd-t" class="sub" style="margin:0;font-size:16px;line-height:22px">新建 Agent 对话</h2>
          <p class="cap" style="margin:0;color:{{t.mfg}}">创建后 Agent 不能更换，模型可在对话中调整。</p>
        </div>
        <fieldset class="col" style="gap:8px;border:0;padding:0;margin:0">
          <legend class="cap" style="font-weight:500;margin-bottom:8px">Agent</legend>
          <button type="button" class="pick" aria-pressed="true" style="box-shadow:inset 0 0 0 2px {{t.fg}}"><span style="font-weight:500">工作区助手</span><span class="cap" style="color:{{t.mfg}}">查看空间文件、查询时间；工具：current_time、list_workspace_files</span></button>
          <button type="button" class="pick hv" aria-pressed="false" style="box-shadow:inset 0 0 0 1px {{t.border}}"><span style="font-weight:500">[项目自定义 Agent]</span><span class="cap" style="color:{{t.mfg}}">由项目在 agents.project.ts 中声明</span></button>
        </fieldset>
        <div class="col" style="gap:6px">
          <label for="nd-model" class="cap" style="font-weight:500">模型</label>
          <button id="nd-model" type="button" aria-haspopup="listbox" class="row" style="height:36px;padding:0 12px;border-radius:8px;box-shadow:inset 0 0 0 1px {{t.border}};justify-content:space-between">通用模型<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.mfg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
          <span class="cap" style="color:{{t.mfg}}">只列出支持工具调用、且当前套餐可用的模型。</span>
        </div>
        <div class="row" style="gap:8px;justify-content:flex-end">
          <button type="button" class="btn hv" onClick="{{closeNew}}" style="box-shadow:inset 0 0 0 1px {{t.border}}">取消</button>
          <a href="Main.dc.html" class="btn" style="background:{{t.primary}};color:{{t.pfg}};text-decoration:none">开始对话</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["normal","new","empty","loading","error"],"default":"normal"},"$preview":{"width":1440,"height":900}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    destructive: '#fca5a5', warn: '#fcd34d', border: 'rgba(245,245,245,0.12)', active: 'rgba(255,255,255,0.1)', overlay: 'rgba(0,0,0,0.6)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    destructive: '#b91c1c', warn: '#a16207', border: 'rgba(23,23,23,0.12)', active: 'rgba(0,0,0,0.07)', overlay: 'rgba(0,0,0,0.4)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#252525' : '#f4f4f5';
  t.sh2 = dark ? 'inset 0 0 0 1px rgba(255,255,255,0.02), 0 1px 1px -0.5px rgba(0,0,0,0.18)' : '0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06)';
  t.sh5 = dark ? '0 0 0 1px rgba(255,255,255,0.08), 0 6px 12px -4px rgba(0,0,0,0.4)' : '0 0 0 1px rgba(0,0,0,0.06), 0 6px 12px -4px rgba(0,0,0,0.12)';
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var pd = !!this.props.dark;
    var dark = st.od && st.od.base === pd ? st.od.val : pd;
    var t = uiTokens(dark);
    var mode = this.props.state || 'normal';
    var newOpen = st.no && st.no.base === mode ? st.no.val : mode === 'new';
    var data = [
      ['空间文件统计', '等待你确认', t.warn, '1 分钟前'],
      ['整理本周上传的图片', '已完成 · 4 步', t.mfg, '2 小时前'],
      ['季度回顾封面', '已停止', t.mfg, '昨天'],
      ['文档大小清单', '已完成 · 2 步', t.mfg, '11 月 20 日'],
      ['查询各时区时间', '失败：模型暂不可用', t.destructive, '11 月 18 日']
    ];
    var rows = data.map(function (d, i) {
      return { title: d[0], state: d[1], stateColor: d[2], time: d[3], agent: '工作区助手', model: '通用模型', sep: i ? 'border-top:1px solid ' + t.border : '' };
    });
    return {
      t: t, rows: rows, newOpen: newOpen,
      s: { list: mode === 'normal' || mode === 'new', empty: mode === 'empty', loading: mode === 'loading', error: mode === 'error' },
      themeLabel: dark ? '切换到浅色' : '切换到深色',
      toggleTheme: function () { self.setState({ od: { base: pd, val: !dark } }); },
      openNew: function () { self.setState({ no: { base: mode, val: true } }); },
      closeNew: function () { self.setState({ no: { base: mode, val: false } }); }
    };
  }
}
</script>
</body>
</html>
