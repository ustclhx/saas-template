<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent 对话页（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:8px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:9999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.ubub{align-self:flex-end;max-width:85%;padding:10px 14px;border-radius:12px}
.toolh{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;font-size:13px;line-height:18px;border-radius:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{border-radius:6px;animation:sk 1.6s ease-in-out infinite}
@keyframes sk{0%,100%{opacity:1}50%{opacity:0.5}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex-shrink:0}
sc-if,sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.panel}};color:{{t.fg}}">
  <header class="row" style="height:52px;gap:4px;padding:0 4px;border-bottom:1px solid {{t.border}};flex-shrink:0">
    <a href="ListMobile.dc.html" class="ib" aria-label="返回 Agent 对话列表" style="color:{{t.mfg}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span class="col" style="flex:1;min-width:0"><h1 class="sub" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{title}}</h1><span class="cap" style="color:{{t.mfg}}">工作区助手 · 通用模型</span></span>
    <button type="button" class="ib" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="color:{{t.mfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
  </header>

  <div class="col" style="flex:1;min-height:0;overflow:hidden;padding:16px;gap:16px">
    <sc-if value="{{s.loading}}" hint-placeholder-val="{{false}}">
      <span class="sk" style="align-self:flex-end;width:220px;height:40px;border-radius:12px;background:{{t.active}}"></span>
      <span class="sk" style="height:40px;border-radius:8px;background:{{t.active}}"></span>
      <span class="sk" style="height:12px;width:90%;background:{{t.active}}"></span>
      <span class="sk" style="height:12px;width:60%;background:{{t.active}}"></span>
    </sc-if>
    <sc-if value="{{s.thread}}" hint-placeholder-val="{{true}}">
      <div class="ubub" style="background:{{t.secondary}}">统计本空间文件，并给大视频生成封面图。</div>
      <div class="toolh" style="box-shadow:inset 0 0 0 1px {{t.border}}">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.mfg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
        <span style="font-weight:500;flex:1">列出空间文件</span>
        <span class="badge" style="background:{{t.successSoft}};color:{{t.success}}">已完成</span>
      </div>
      <p style="margin:0">共 48 个文件：图片 31 个 212 MB，视频 9 个 1.8 GB，文档 8 个 36 MB。超过 50 MB 的视频有 3 个。</p>
      <sc-if value="{{s.running}}" hint-placeholder-val="{{false}}">
        <div class="toolh" style="box-shadow:inset 0 0 0 1px {{t.border}}">
          <svg class="spin" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.mfg}}" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
          <span style="font-weight:500;flex:1">生成图片</span>
          <span class="badge" style="background:{{t.secondary}};color:{{t.mfg}}">运行中</span>
        </div>
      </sc-if>
      <sc-if value="{{s.approval}}" hint-placeholder-val="{{true}}">
        <div class="col" role="group" aria-labelledby="mp-t" style="gap:10px;padding:14px;border-radius:10px;background:{{t.card}};border:1px solid {{t.border}};box-shadow:{{t.shSm}}">
          <div class="row" style="gap:8px"><span id="mp-t" style="font-weight:600;flex:1">需要你确认：生成图片</span><span class="badge" style="background:{{t.warnSoft}};color:{{t.warn}}">等待确认</span></div>
          <p class="cap" style="margin:0;color:{{t.mfg}};line-height:18px">「季度回顾」封面，1024×576，预计另扣 8 积分。</p>
          <div class="col" style="gap:8px">
            <button type="button" class="btn" style="background:{{t.primary}};color:{{t.pfg}}">批准并执行</button>
            <button type="button" class="btn" style="box-shadow:inset 0 0 0 1px {{t.border}}">拒绝</button>
          </div>
        </div>
      </sc-if>
    </sc-if>
  </div>

  <div style="padding:8px 12px 12px;flex-shrink:0">
    <sc-if value="{{s.error}}" hint-placeholder-val="{{false}}">
      <div role="alert" class="col" style="gap:8px;padding:12px;margin-bottom:8px;border-radius:10px;border:1px solid {{t.border}};background:{{t.card}}">
        <span style="font-weight:500;color:{{t.destructive}}">积分不足</span>
        <span class="cap" style="color:{{t.mfg}};line-height:18px">每轮需预留 24 积分，当前余额 5。充值后再发送，草稿会保留。</span>
        <a href="#" class="btn" style="background:{{t.primary}};color:{{t.pfg}}">查看套餐</a>
      </div>
    </sc-if>
    <form class="row" aria-label="发送消息" style="gap:8px;padding:6px 6px 6px 12px;border-radius:12px;background:{{t.card}};border:1px solid {{t.border}}">
      <label for="m-composer" class="sr">消息</label>
      <textarea id="m-composer" rows="1" placeholder="描述要完成的任务" style="flex:1;resize:none;border:0;background:transparent;font-size:16px;line-height:22px;outline:none;padding:4px 0">{{draft}}</textarea>
      <sc-if value="{{s.busy}}" hint-placeholder-val="{{true}}">
        <button type="button" class="ib" aria-label="停止" style="width:40px;height:40px;background:{{t.primary}};color:{{t.pfg}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></button>
      </sc-if>
      <sc-if value="{{s.idle}}" hint-placeholder-val="{{false}}">
        <button type="button" class="ib" aria-label="发送" style="width:40px;height:40px;background:{{t.primary}};color:{{t.pfg}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"></path></svg></button>
      </sc-if>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["approval","running","loading","error"],"default":"approval"},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717',
    destructive: '#fca5a5', success: '#4ade80', successSoft: 'rgba(74,222,128,0.14)', warn: '#fcd34d', warnSoft: 'rgba(252,211,77,0.14)',
    border: 'rgba(245,245,245,0.12)', active: 'rgba(255,255,255,0.1)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa',
    destructive: '#b91c1c', success: '#15803d', successSoft: 'rgba(21,128,61,0.1)', warn: '#a16207', warnSoft: 'rgba(161,98,7,0.1)',
    border: 'rgba(23,23,23,0.12)', active: 'rgba(0,0,0,0.07)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#252525' : '#f4f4f5';
  t.shSm = '0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1)';
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var pd = !!this.props.dark;
    var dark = st.od && st.od.base === pd ? st.od.val : pd;
    var mode = this.props.state || 'approval';
    var s = {
      loading: mode === 'loading', thread: mode !== 'loading', running: mode === 'running',
      approval: mode === 'approval', error: mode === 'error',
      busy: mode === 'running' || mode === 'approval', idle: !(mode === 'running' || mode === 'approval')
    };
    return {
      t: uiTokens(dark), s: s,
      title: '空间文件统计',
      themeLabel: dark ? '切换到浅色' : '切换到深色',
      toggleTheme: function () { self.setState({ od: { base: pd, val: !dark } }); },
      draft: mode === 'error' ? '再试一次生成封面图' : ''
    };
  }
}
</script>
</body>
</html>
