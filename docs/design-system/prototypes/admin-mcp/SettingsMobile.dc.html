<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>功能模型（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.r{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;margin:0;cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.cap{font-size:12px;line-height:16px}
.sub{font-size:14px;line-height:20px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:8px;font-weight:500}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px}
.sel{height:44px;padding:0 12px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:9999px;font-size:12px;line-height:16px;font-weight:500}
svg{flex-shrink:0}
sc-for{display:contents}
</style>
</helmet>
<div class="r" style="background:{{t.panel}};color:{{t.fg}}">
  <header class="row" style="height:56px;padding:0 6px;gap:4px;border-bottom:1px solid {{t.border}}">
    <button type="button" class="ib" aria-label="打开后台导航"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <h1 class="sub" style="margin:0;flex:1;font-size:16px">运行时设置</h1>
  </header>
  <div class="col" style="flex:1;overflow:auto;padding:16px;gap:12px">
    <div class="col" style="gap:4px">
      <h2 class="sub" style="margin:0">功能模型</h2>
      <p class="cap" style="margin:0;color:{{t.mfg}}">未选择或所选模型停用时，按沿用顺序使用其他功能的模型。</p>
    </div>
    <sc-for list="{{features}}" as="f" hint-placeholder-count="4">
      <div class="col" style="gap:8px;padding:12px;border-radius:10px;background:{{t.card}};box-shadow:inset 0 0 0 1px {{t.border}}">
        <div class="row" style="gap:8px"><span style="font-weight:500;flex:1">{{f.label}}</span><span class="badge" style="background:{{t.secondary}};color:{{t.mfg}}">{{f.kind}}</span></div>
        <span class="mono" style="color:{{t.mfg}}">{{f.id}}{{f.inheritNote}}</span>
        <button type="button" class="sel" aria-haspopup="listbox" aria-label="{{f.label}} 的模型" style="box-shadow:inset 0 0 0 1px {{t.border}};color:{{f.selColor}}">{{f.choice}}<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.mfg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
        <div class="row" style="gap:8px"><span aria-hidden="true" style="width:8px;height:8px;border-radius:9999px;background:{{f.dot}}"></span><span class="cap" style="color:{{t.mfg}}"><span style="color:{{t.fg}};font-weight:500">{{f.resolved}}</span> · {{f.source}}</span></div>
      </div>
    </sc-for>
    <button type="button" class="btn" style="background:{{t.primary}};color:{{t.pfg}}">保存</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
function uiTokens(dark) {
  var t = dark ? {
    s: ['#171717', '#1e1e1e', '#252525'], fg: '#f5f5f5', mfg: '#b0b0b0', primary: '#f5f5f5', pfg: '#171717', ok: '#86efac', border: 'rgba(245,245,245,0.12)'
  } : {
    s: ['#fafafa', '#fcfcfc', '#ffffff'], fg: '#171717', mfg: '#6b6b6b', primary: '#171717', pfg: '#fafafa', ok: '#15803d', border: 'rgba(23,23,23,0.12)'
  };
  t.bg = t.s[0]; t.panel = t.s[1]; t.card = t.s[2];
  t.secondary = dark ? '#252525' : '#f4f4f5';
  return t;
}
class Component extends DCLogic {
  renderVals() {
    var t = uiTokens(!!this.props.dark);
    var feats = [
      { id: 'report.summary', label: '报告摘要', kind: '文本', choice: '通用模型', resolved: '通用模型', source: '显式选择', ok: true },
      { id: 'report.detail', label: '报告详情', kind: '文本', inherit: 'report.summary', choice: null, resolved: '通用模型', source: '沿用自 report.summary', ok: false },
      { id: 'cover.image', label: '封面图', kind: '图片', choice: '高清出图', resolved: '高清出图', source: '显式选择', ok: true },
      { id: 'cover.thumbnail', label: '缩略图', kind: '图片', inherit: 'cover.image', choice: null, resolved: '高清出图', source: '沿用自 cover.image', ok: false }
    ];
    return {
      t: t,
      features: feats.map(function (f) {
        return { id: f.id, label: f.label, kind: f.kind, inheritNote: f.inherit ? ' · 沿用 ' + f.inherit : '', choice: f.choice || '未选择', selColor: f.choice ? t.fg : t.mfg, resolved: f.resolved, source: f.source, dot: f.ok ? t.ok : t.mfg };
      })
    };
  }
}
</script>
</body>
</html>
