packages:
  - apps/*
  - packages/*
  - plugins/*
allowBuilds:
  '@sentry/cli': true
  # agents → mimetext → @babel/runtime-corejs3 的 postinstall 只打印赞助信息
  core-js-pure: false
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - turbo@2.11.7
