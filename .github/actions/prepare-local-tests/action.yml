name: Prepare local tests
description: Initialize temporary Postgres, install dependencies and Chromium, and prepare local authentication
inputs:
  database:
    description: Temporary Postgres database name
    required: true
runs:
  using: composite
  # 从 ci.yml 的 e2e-smoke 提取；冒烟和夜间验收共用安装、认证与迁移步骤。
  steps:
    - name: Initialize database roles
      env:
        PGURL: postgres://postgres:postgres@localhost:5432/${{ inputs.database }}
      shell: bash
      run: |
        psql "$PGURL" -v ON_ERROR_STOP=1 -f infra/local/initdb/01-roles.sql
        psql "$PGURL" -v ON_ERROR_STOP=1 -f infra/local/initdb/02-db-grants.sql
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Get Playwright version
      id: playwright
      working-directory: apps/web
      shell: bash
      run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-shell
    # apt 镜像偶发卡死（曾整步挂满 5 分钟）：给 apt 单次请求加超时，并对整次安装限时重试。
    # runner 启动时的 apt-daily 常占着 dpkg 锁，apt 默认立即失败；改为最多等待 90 秒。
    - name: Configure apt timeouts
      shell: bash
      run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "90";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
    - name: Install Chromium
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: timeout -k 10 600 pnpm --filter @saas/web exec playwright install --with-deps --only-shell chromium
    - name: Install Chromium system dependencies
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if timeout -k 10 220 pnpm --filter @saas/web exec playwright install-deps chromium; then exit 0; fi
          echo "::warning::playwright install-deps 第 ${attempt} 次失败或超时，重试"
          # 被中断的 dpkg 会留下半配置状态，下一次安装前先修复。
          sudo dpkg --configure -a || true
          sleep 5
        done
        exit 1
    - name: Prepare local authentication and migrate
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs'
        import { randomBytes } from 'node:crypto'
        const vars = readFileSync('apps/web/.dev.vars.example', 'utf8')
          .replace(/^BETTER_AUTH_SECRET=.*$/m, `BETTER_AUTH_SECRET=${randomBytes(32).toString('base64')}`)
        writeFileSync('apps/web/.dev.vars', vars, { mode: 0o600 })
        NODE
        pnpm --filter @saas/db db:migrate
