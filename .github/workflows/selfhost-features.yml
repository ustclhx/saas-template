name: Selfhost disabled features

on:
  pull_request:
    # PR 只在影响功能裁剪生成与自托管验收的改动上运行：模板开关、配置包、生成器、
    # selfhost 材料、本验收脚本与其浏览器夹具及本 workflow。main push 与手动触发始终全量覆盖。
    paths:
      - 'template.config.ts'
      - 'packages/config/**'
      - 'plugins/*/plugin.ts'
      - 'scripts/plugins/**'
      - 'scripts/create-project'
      - 'scripts/create-project.mjs'
      - 'scripts/template-base.mjs'
      - 'scripts/selfhost-features.mjs'
      - 'scripts/selfhost-features-routes.mjs'
      - 'apps/web/e2e/selfhost/**'
      - 'apps/web/playwright.selfhost.config.ts'
      - 'deploy/selfhost/**'
      - '.github/workflows/selfhost-features.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR 的新推送取消旧验收；main push 与手动触发各自独立，不被取消。
concurrency:
  group: selfhost-features-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v4
      - name: Install locked workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-chromium
      - name: Generate, build and accept the disabled-feature project on fresh Compose volumes
        run: node scripts/selfhost-features.mjs feature-artifacts
      # 只上传固定字段的验收报告，不上传副本、邮件、运行日志或临时凭据。
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: selfhost-disabled-features
          path: feature-artifacts/report.json
          if-no-files-found: error
          retention-days: 3
