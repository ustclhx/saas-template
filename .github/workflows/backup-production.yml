name: Backup production database

# production-deployment spec「生产数据库备份与恢复演练」：每日用只读角色生成逻辑备份，
# age 加密后上传到开启 Bucket Lock 的 R2 桶。失败即 workflow 失败（GitHub 向维护者发送通知）。
# 定时运行需仓库变量 PRODUCTION_BACKUP_SCHEDULE=true（凭据与 readonly 的 pg_read_all_data 授权就绪后开启）。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_BACKUP_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    # 无审批、仅 main：每日定时任务不能等待人工；只持有 readonly 凭据与备份桶写入密钥
    environment: production-backup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump, encrypt and upload
        env:
          BACKUP_DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/production/backup.sh
