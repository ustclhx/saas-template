name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      bypass:
        description: 'CI bypass for a manual release'
        type: choice
        options: [none, hotfix]
        default: none
      reason:
        description: 'Required reason for hotfix CI bypass'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 也可来自 PR；只接受本仓库 main 的 push 检查结果。
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      STAGING_URL: https://web-staging.saas-jobs.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          ref: main
          path: .release-tools
      - name: Keep release controls outside the target checkout
        run: |
          mv .release-tools "$RUNNER_TEMP/release-tools"
          echo "RELEASE_TOOLS=$RUNNER_TEMP/release-tools/scripts/production" >> "$GITHUB_ENV"

      - name: Verify main commit and successful main push CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PHASE: ${{ vars.RELEASE_PHASE }}
          RELEASE_BYPASS: ${{ inputs.bypass || 'none' }}
          RELEASE_REASON: ${{ inputs.reason }}
        run: node "$RELEASE_TOOLS/release-policy.mjs" "$DEPLOY_SHA"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate staging database
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: node "$RELEASE_TOOLS/migrate.mjs"

      - name: Build jobs
        env:
          APP_VERSION: ${{ env.DEPLOY_SHA }}
        run: >-
          pnpm --filter @saas/jobs exec wrangler deploy --env staging --dry-run
          --outdir dist --var "APP_VERSION:$APP_VERSION"

      - name: Build web
        env:
          CLOUDFLARE_ENV: staging
          APP_VERSION: ${{ env.DEPLOY_SHA }}
          # 预渲染只需本地 Hyperdrive 能启动；快照按既有设计降级为示例数据。
          # 使用不可达的本地占位连接，绝不指向真实数据库。
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: 'postgres://app:app@127.0.0.1:1/unused'
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_CACHED: 'postgres://app:app@127.0.0.1:1/unused'
        run: pnpm --filter @saas/web build

      - name: Create Sentry release and upload server source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN" && test -n "$SENTRY_ORG" && test -n "$SENTRY_PROJECT"
          test -f apps/web/dist/server/index.js.map
          test -f apps/jobs/dist/index.js.map
          pnpm exec sentry-cli releases new "$SENTRY_RELEASE"
          pnpm exec sentry-cli sourcemaps inject apps/web/dist/server
          pnpm exec sentry-cli sourcemaps inject apps/jobs/dist
          pnpm exec sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --dist web --validate --strict --wait apps/web/dist/server
          pnpm exec sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --dist jobs --validate --strict --wait apps/jobs/dist
          # 浏览器暂未接入 SDK，客户端 map 不需要部署；避免被静态 assets 公开。
          find apps/web/dist/client -type f -name '*.map' -delete

      - name: Deploy built jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_VERSION: ${{ env.DEPLOY_SHA }}
        # 上传注入 debug ID 后的文件；不得从源码重新 bundle。
        run: >-
          pnpm --filter @saas/jobs exec wrangler deploy dist/index.js --env staging
          --no-bundle --var "APP_VERSION:$APP_VERSION"

      - name: Deploy built web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Vite 产物配置已选择 staging 并带 assets / no_bundle；部署不再运行 Vite。
        run: pnpm --filter @saas/web exec wrangler deploy --config dist/server/wrangler.json --no-bundle

      - name: Confirm deployment health and version
        run: node scripts/staging/wait-healthy.mjs "$STAGING_URL/api/health" "$DEPLOY_SHA"

      - name: Install Chromium
        run: pnpm --filter @saas/web exec playwright install --with-deps chromium

      - name: Smoke test staging
        env:
          APP_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: pnpm --filter @saas/web exec playwright test --project staging

      # 失败时保留 trace（随机邮箱与固定测试密码，不含 secrets），供定位发布后的偶发失败
      - name: Upload smoke traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: staging-smoke-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Finalize Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm exec sentry-cli releases finalize "$DEPLOY_SHA"
