name: Nightly

on:
  schedule:
    # UTC 19:00 = 北京时间次日 03:00。
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e-full:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 服务与连接配置沿用 ci.yml/e2e-smoke；全量夹具要求独立库使用 saas_wt_ 前缀。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_wt_nightly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_wt_nightly"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://app:app@localhost:5432/saas_wt_nightly
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_CACHED: postgres://app:app@localhost:5432/saas_wt_nightly
      MIGRATION_DATABASE_URL: postgres://migrator:migrator@localhost:5432/saas_wt_nightly
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-local-tests
        with:
          database: saas_wt_nightly
      # loadEnv('worktree') 和 readLocalEnv 均需读到夹具连接；只写 runner 内的临时数据库。
      - name: Prepare isolated e2e fixtures
        run: |
          cat > .env.worktree <<'VARS'
          DATABASE_URL=postgres://app:app@localhost:5432/saas_wt_nightly
          MIGRATION_DATABASE_URL=postgres://migrator:migrator@localhost:5432/saas_wt_nightly
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgres://app:app@localhost:5432/saas_wt_nightly
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_CACHED=postgres://app:app@localhost:5432/saas_wt_nightly
          VARS
      - run: pnpm build
      # 沿用默认配置的全部离线用例，不选用 Stripe/AI 联通配置，也不增加测试 retry。
      - name: Run full local e2e
        run: pnpm --filter @saas/web test:e2e --reporter=github,html
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-full-report-and-traces
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  create-project-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 独立 runner/PG，不与 e2e-full 共享状态；服务配置来源同 ci.yml/e2e-smoke。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_ci_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://app:app@localhost:5432/saas_ci_e2e
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_CACHED: postgres://app:app@localhost:5432/saas_ci_e2e
      MIGRATION_DATABASE_URL: postgres://migrator:migrator@localhost:5432/saas_ci_e2e
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-local-tests
        with:
          database: saas_ci_e2e
      # 生成器会主动清除父进程数据库连接，副本自检只跑类型、单元测试及 Node 构建。
      # 衍生项目不包含模板维护矩阵；模板本身始终运行，不能跳过其中的失败用例。
      - name: Verify generated projects
        if: hashFiles('scripts/create-project.verify.test.mjs') != ''
        run: pnpm test:create-project:verify

  notify-failure:
    needs: [e2e-full, create-project-verify]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.e2e-full.result == 'failure' || needs.create-project-verify.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create or update nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed_jobs=$(jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")' <<< "$JOB_RESULTS")
          run_date=$(date -u +%F)
          title="[Nightly] ${run_date}: ${failed_jobs}"
          body_file="$RUNNER_TEMP/nightly-failure.md"
          printf '日期（UTC）：%s\n\n失败 job：%s\n\n运行：%s\n\n请检查日志与 Playwright artifact，区分过时断言与真实缺陷；不得跳过、删除用例或增加 retry 掩盖失败。\n' "$run_date" "$failed_jobs" "$RUN_URL" > "$body_file"
          if [ "$(gh label list --limit 1000 --json name --jq 'any(.name == "nightly-failure")')" != true ]; then
            gh label create nightly-failure --color B60205 --description 'Nightly e2e or generator verification failure'
          fi
          issue_number=$(gh issue list --state open --label nightly-failure --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "$title" --label nightly-failure --body-file "$body_file"
          fi
