name: Deploy production

# production-deployment spec：只由 v* tag 触发；被发布的提交必须在 main 上且已成功发布到 staging，
# 经 production environment 审批后按「构建 → 迁移 → jobs → web → 健康完整 SHA → 只读冒烟」串行执行。
# 回滚从 main 的当前 workflow 执行并指定 tag，门禁脚本不取自旧 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (run this workflow on main for rollback)'
        type: string
        required: false
      bypass:
        description: 'CI bypass (staging success and production approval still required)'
        type: choice
        options: [none, hotfix]
        default: none
      reason:
        description: 'Required reason for hotfix CI bypass'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tools_sha: ${{ steps.release.outputs.tools_sha }}
    steps:
      # 校验使用 main 上的维护版本，避免旧 tag 没有门禁脚本。
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version tag and verify main, staging and CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          RELEASE_PHASE: ${{ vars.RELEASE_PHASE }}
          RELEASE_BYPASS: ${{ inputs.bypass || 'none' }}
          RELEASE_REASON: ${{ inputs.reason }}
        run: |
          release_ref="$GITHUB_REF"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$TAG_INPUT" ]; then
            release_ref="refs/tags/$TAG_INPUT"
          fi
          if [[ "$release_ref" != refs/tags/v* ]]; then
            echo '::error::A v* version tag is required; dispatch on main with the tag input'
            exit 1
          fi
          sha=$(git rev-parse --verify "$release_ref^{commit}")
          node scripts/production/check-release.mjs "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tools_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ needs.verify.outputs.sha }}
      RELEASE_PHASE: ${{ vars.RELEASE_PHASE }}
      PRODUCTION_URL: https://app.ezarouter.cc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tools_sha }}
          path: .release-tools
      - name: Keep release controls outside the target checkout
        run: |
          mv .release-tools "$RUNNER_TEMP/release-tools"
          echo "RELEASE_TOOLS=$RUNNER_TEMP/release-tools/scripts/production" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify production Sentry configuration
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node "$RELEASE_TOOLS/release-policy.mjs" sentry

      - name: Check rollback schema compatibility against running production
        if: github.event_name == 'workflow_dispatch'
        run: node "$RELEASE_TOOLS/check-rollback.mjs" "$DEPLOY_SHA"

      - name: Build jobs
        env:
          APP_VERSION: ${{ env.DEPLOY_SHA }}
        run: >-
          pnpm --filter @saas/jobs exec wrangler deploy --env production --dry-run
          --outdir dist --var "APP_VERSION:$APP_VERSION"

      - name: Build web
        env:
          CLOUDFLARE_ENV: production
          APP_VERSION: ${{ env.DEPLOY_SHA }}
          # 与 staging 相同：预渲染只用不可达的本地占位连接，绝不指向真实数据库。
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: 'postgres://app:app@127.0.0.1:1/unused'
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_CACHED: 'postgres://app:app@127.0.0.1:1/unused'
        run: pnpm --filter @saas/web build

      - name: Upload server source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
        run: |
          # live 的完整配置已在构建前校验；testing 允许缺配置并保留警告。
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            test -f apps/web/dist/server/index.js.map
            test -f apps/jobs/dist/index.js.map
            pnpm exec sentry-cli releases new "$SENTRY_RELEASE"
            pnpm exec sentry-cli sourcemaps inject apps/web/dist/server
            pnpm exec sentry-cli sourcemaps inject apps/jobs/dist
            pnpm exec sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --dist web --validate --strict --wait apps/web/dist/server
            pnpm exec sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --dist jobs --validate --strict --wait apps/jobs/dist
          else
            echo "::warning::Production Sentry secrets are not configured; skipping source map upload"
          fi
          find apps/web/dist/client -type f -name '*.map' -delete

      - name: Migrate production database
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: node "$RELEASE_TOOLS/migrate.mjs"

      - name: Deploy built jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_VERSION: ${{ env.DEPLOY_SHA }}
        run: >-
          pnpm --filter @saas/jobs exec wrangler deploy dist/index.js --env production
          --no-bundle --var "APP_VERSION:$APP_VERSION"

      - name: Deploy built web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @saas/web exec wrangler deploy --config dist/server/wrangler.json --no-bundle

      - name: Confirm deployment health and version
        run: node scripts/staging/wait-healthy.mjs "$PRODUCTION_URL/api/health" "$DEPLOY_SHA"

      - name: Install Chromium
        run: pnpm --filter @saas/web exec playwright install --with-deps chromium

      - name: Read-only smoke test production
        env:
          APP_VERSION: ${{ env.DEPLOY_SHA }}
        run: pnpm --filter @saas/web exec playwright test --project production

      - name: Upload smoke traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: production-smoke-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Rollback hint
        if: failure()
        run: >-
          echo "::error::Production deploy failed. Roll back by re-running this workflow on the previous tag:
          gh workflow run deploy-production.yml --ref main -f tag=<previous-tag>. Schema is not rolled back; see docs/runbooks/production-neon.md."

      - name: Finalize Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            pnpm exec sentry-cli releases finalize "$DEPLOY_SHA"
          fi
