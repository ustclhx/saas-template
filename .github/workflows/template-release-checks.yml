name: Template release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # 与 CI 相同：只取消同一 PR 的旧运行，main 每个提交都保留完整检查结果。
  group: template-release-checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # 工具只依赖 Node 内置模块，独立检查无需安装整个工作区。
      - run: node --test scripts/template-release.test.mjs
      - name: Check migrations and changed upgrade notes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$CHANGE_BASE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          node scripts/template-release.mjs lint-migrations --base "$base"
          CHANGE_BASE="$base" node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'

          const semver = '(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-(?:0|[1-9]\\d*|\\d*[A-Za-z-][0-9A-Za-z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?'
          const notePath = new RegExp(`^docs/upgrades/(${semver})\\.md$`)
          // 禁用重命名识别以同时校验旧路径；删除已发布版本的说明必须失败，不能被过滤掉。
          const files = execFileSync('git', [
            'diff', '--no-renames', '--name-only', '-z', process.env.CHANGE_BASE,
            'HEAD', '--', 'docs/upgrades/',
          ], { encoding: 'utf8' }).split('\0').filter(Boolean)
          const exists = (file) => {
            try { execFileSync('git', ['cat-file', '-e', `HEAD:${file}`], { stdio: 'ignore' }); return true }
            catch { return false }
          }
          const released = (version) => execFileSync('git', [
            'ls-remote', '--tags', 'origin', `refs/tags/template-v${version}`,
          ], { encoding: 'utf8' }).trim() !== ''
          for (const file of new Set(files)) {
            const match = notePath.exec(file)
            // 未发布版本（无 template-v 标签）的说明草稿可以删除或改名；已发布版本的说明删除仍然失败。
            if (match && !exists(file) && !released(match[1])) continue
            if (match) {
              execFileSync(process.execPath, [
                'scripts/template-release.mjs', 'check', '--version', match[1],
              ], { stdio: 'inherit' })
            }
          }
          NODE
