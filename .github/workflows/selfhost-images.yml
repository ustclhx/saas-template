name: Selfhost images

on:
  pull_request:
    # PR 只在可能让镜像构建/运行与普通 CI 结果不同的改动上构建：selfhost 材料与 Dockerfile、
    # 本 workflow、依赖清单（决定 pnpm deploy --prod 闭包与原生 sharp）、PG 镜像复制的
    # initdb SQL、镜像构建上下文中的 Node 构建入口。应用源码本身由 CI 的 build:node 覆盖，
    # 合并后 main push 仍全量构建。末尾排除纯文档改动。
    paths:
      - 'deploy/selfhost/**'
      - '.github/workflows/selfhost-images.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'infra/local/initdb/**'
      - 'scripts/sentry-node-maps.mjs'
      - 'apps/*/scripts/build-node*.mjs'
      - 'apps/web/vite.node.config.ts'
      - '!**/*.md'
  push:
    branches: [main]
    # 纯文档/规格/证据改动不影响镜像内容，跳过镜像构建；发布经 workflow_call 不受影响。
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
  workflow_call:
    inputs:
      sha:
        description: Full source commit SHA to build
        required: true
        type: string

permissions:
  contents: read

# 同一 PR 的新推送取消旧构建；main push 与发布调用（workflow_call 中 run_id 为调用方的）
# 各用独立 group，不排队、不被取消，发布依赖的验证不会被后续 main push 挤掉。
concurrency:
  group: selfhost-images-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    # 2026-11 起只构建与发布 linux/amd64；无异构部署需求。arm64 仅保留本机开发构建能力。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            builder: container-gha
          # 临时对照：默认 docker driver（无远端层缓存，但无需导出 tarball 再 load）。
          - arch: amd64
            runner: ubuntu-24.04
            builder: docker
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v4
        if: matrix.builder == 'container-gha'
        with:
          # 托管 runner 用完即弃；跳过 post 阶段移除 builder 及其构建状态的清理耗时。
          cleanup: false
      - name: Expose the Actions cache endpoint to the build step only
        id: cache
        if: matrix.builder == 'container-gha'
        uses: actions/github-script@v8
        with:
          script: |
            // buildx 的 type=gha 需要 runtime token；只作为 step output 交给构建步骤，
            // 不写入 GITHUB_ENV，后续运行镜像的 smoke 与上传步骤拿不到。
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN)
            core.setOutput('token', process.env.ACTIONS_RUNTIME_TOKEN)
            core.setOutput('results-url', process.env.ACTIONS_RESULTS_URL ?? '')
            core.setOutput('cache-url', process.env.ACTIONS_CACHE_URL ?? '')
      - name: Resolve actual checked-out revision
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Test publication policy boundaries
        run: node --test deploy/selfhost/images/policy.test.mjs
      - name: Verify pinned bases include the published platform
        run: node deploy/selfhost/images/check-bases.mjs
      - name: Build and export native images
        env:
          SELFHOST_BUILD_CACHE: ${{ matrix.builder == 'container-gha' && 'gha' || '' }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache.outputs.token }}
          ACTIONS_RESULTS_URL: ${{ steps.cache.outputs.results-url }}
          ACTIONS_CACHE_URL: ${{ steps.cache.outputs.cache-url }}
          ACTIONS_CACHE_SERVICE_V2: ${{ matrix.builder == 'container-gha' && 'true' || '' }}
        run: node deploy/selfhost/images/build.mjs '${{ steps.source.outputs.sha }}' '${{ matrix.arch }}' image-artifacts
      - name: Smoke images and real runtime readiness
        run: node deploy/selfhost/images/smoke.mjs '${{ steps.source.outputs.sha }}' '${{ matrix.arch }}' image-artifacts
      # 只有整组 smoke 通过才供发布 workflow 使用，不上传临时运行文件或容器日志。
      # 镜像 tar 只在发布调用（workflow_call 带 sha 输入）时上传，供同 run 的 publish 作业加载；
      # PR/main 只保留 build/smoke 证据 JSON，省去数 GB 的压缩上传。
      - uses: actions/upload-artifact@v6
        if: inputs.sha && matrix.builder == 'container-gha'
        with:
          name: selfhost-images-${{ steps.source.outputs.sha }}-${{ matrix.arch }}
          path: image-artifacts/
          if-no-files-found: error
          retention-days: 3
          # docker save 的 tar 未压缩；最低压缩级别仍能缩小体积，避免默认级别的 CPU 耗时。
          compression-level: 1
      - uses: actions/upload-artifact@v6
        if: '!inputs.sha'
        with:
          name: selfhost-image-evidence-${{ steps.source.outputs.sha }}-${{ matrix.arch }}-${{ matrix.builder }}
          path: image-artifacts/*.json
          if-no-files-found: error
          retention-days: 3
